    <div class="tgrid" id="sZoom" style="grid-template-columns:repeat(4,1fr)">${[["0.9","Klein"],["1","Normal"],["1.12","Groß"],["1.25","Sehr groß"]].map(([z, l]) => `<button class="tag" data-zoom="${z}" aria-pressed="${(getComputedStyle(document.documentElement).getPropertyValue("--zoom").trim() || "1") === z}">${l}</button>`).join("")}</div>
    <label class="f" style="margin-top:18px">Schrift für Notizen</label>
    <div class="tgrid two2" id="sFont"><button class="tag" data-font="sans" aria-pressed="${(document.documentElement.dataset.font || "sans") !== "serif"}" style="font-family:var(--text)">Ohne Serifen</button><button class="tag" data-font="serif" aria-pressed="${document.documentElement.dataset.font === "serif"}" style="font-family:'Iowan Old Style','Charter','Noto Serif',Georgia,serif">Mit Serifen</button></div>
    <label class="chkrow"><input type="checkbox" id="sQuick" ${quickOn() ? "checked" : ""}><span><strong>Schnellnotiz-Zeile</strong><small>Ganz oben in der Liste: tippen, Enter, gespeichert.</small></span></label>
    <label class="chkrow"><input type="checkbox" id="sRdTimer" ${(() => { try { return localStorage.getItem("merkn-rd-timer") !== "aus"; } catch { return true; } })() ? "checked" : ""}><span><strong>Stoppuhr im Lesemodus</strong><small>Oben links: Zeit beim Lesen stoppen, dazu die geschätzte Vorlesedauer.</small></span></label>
    <label class="chkrow"><input type="checkbox" id="sSpell" ${spellCfg().on ? "checked" : ""}><span><strong>Rechtschreibprüfung</strong><small>Unterstreicht Tippfehler beim Schreiben. Nutzt die Prüfung deines Browsers bzw. Handys, ohne KI.</small></span></label>
    <div id="spellOpts" ${spellCfg().on ? "" : "hidden"} style="margin:8px 0 0 30px"><label class="f" for="sSpellLang">Sprache</label><select class="inp" id="sSpellLang">${SPELL_LANGS.map(([k, l]) => `<option value="${k}" ${spellCfg().lang === k ? "selected" : ""}>${l}</option>`).join("")}</select>
      <p class="hint">Die Sprache muss im Browser bzw. Handy aktiviert sein. Chrome am PC: Einstellungen → Sprachen → Rechtschreibprüfung, dort z. B. Deutsch und Englisch einschalten. Android: Einstellungen → System → Sprache und Eingabe → Rechtschreibprüfung. Mit „Automatisch“ prüft Chrome alle eingeschalteten Sprachen gleichzeitig.</p></div>
    </section><section class="ssec" id="st-tabs"><h3>Feste Tabs</h3>
    <p>Tags, die als eigener Reiter neben den Bereichen stehen.</p>
    <input class="inp" id="tabIn" value="${esc(tabTags().map(t => "#"+t).join(" "))}" placeholder="#software" autocapitalize="off" autocomplete="off">
    </section><section class="ssec" id="st-fav"><h3>Favoriten-Tags</h3>
    <p>Stehen immer vorne in der Filterzeile und lassen sich in jeder Notiz mit einem Tipp setzen. Auch per langem Druck auf einen Tag.</p>
    <input class="inp" id="favIn" value="${esc(favTags().map(t => "#"+t).join(" "))}" placeholder="#apps #idee" autocapitalize="off" autocomplete="off">
    </section><section class="ssec" id="st-tagsec"><h3>Alle Tags</h3>
    <p>Antippen zum Umbenennen, Zusammenführen oder als Sammlung teilen.</p>
    <div class="taglist">${tagCounts().map(([t, c]) => `<button class="tagrow" data-tagrow="${esc(t)}"><span>#${esc(t)}</span><span class="tc">${c}</span></button>`).join("") || `<p class="hint">Noch keine Tags.</p>`}</div>
    </section><section class="ssec" id="st-swipe"><h3>Wischen in der Liste</h3>
    <p>Was passiert, wenn du eine Notiz zur Seite wischst.</p>
    ${[["swipeR","Nach rechts"],["swipeL","Nach links"]].map(([k,l]) => `<label class="f">${l}</label><div class="chips">${Object.entries(SWIPE).map(([a,v]) => `<button class="tag" data-sw="${k}" data-act="${a}" aria-pressed="${(S.settings[k] || "none") === a}">${v.label}</button>`).join("")}</div>`).join("")}
    </section><section class="ssec" id="st-sort"><h3>Automatisch einsortieren</h3>
    <p>Kommt eines dieser Wörter vor, landet die Notiz im Bereich. Zusätzlich lernt Merkn aus deinen Tags. Mit Komma trennen.</p>
    ${AREAS.map(a => `<label class="f" for="kw-${a}"><span class="dot" data-a="${a}" style="display:inline-block;margin-right:6px"></span>${AREA_NAME[a]}</label><textarea class="inp" id="kw-${a}" style="min-height:70px">${esc((kw[a]||[]).join(", "))}</textarea>`).join("")}
    <label class="f" for="fb">Wenn nichts passt</label>
    <select class="inp" id="fb">${AREAS.map(a => `<option value="${a}" ${S.settings.fallback === a ? "selected" : ""}>${AREA_NAME[a]}</option>`).join("")}</select>
    </section><section class="ssec" id="st-gh"><h3>GitHub</h3>
    ${connectForm("s")}
    <div class="row">
      ${S.cfg ? `<button class="btn" id="sOff">Trennen</button>` : ""}
      <button class="btn" id="sConn">${S.cfg ? "Verbindung speichern" : "Verbinden"}</button>
    </div>
    </section><section class="ssec" id="st-backup"><h3>Backup</h3>
    <p>Sichert alle Notizen, Bilder und Aufnahmen als ZIP. Nach 30 Tagen ohne Backup erinnert Merkn einmal daran.${(() => { let l = ""; try { l = localStorage.getItem("merkn-backup") || ""; } catch {} return l ? ` Letztes Backup auf diesem Gerät: ${new Date(l).toLocaleDateString("de-DE", {day:"numeric", month:"long", year:"numeric"})}.` : ""; })()}</p>
    <label class="f" for="gClient">Google-Client-ID <small>(für Backup direkt in Drive)</small></label>
    <input class="inp" id="gClient" value="${esc(gClient())}" placeholder="…apps.googleusercontent.com" autocapitalize="off" autocomplete="off" spellcheck="false">
    <div class="row" style="justify-content:flex-start"><button class="btn primary" id="bDrive">Backup in Drive</button><button class="btn" id="bFile">Als Datei teilen</button></div>
    <details class="help"><summary>Anleitung: Google Drive einrichten (einmalig, ca. 15 Minuten)</summary><dl><dt>1. Projekt anlegen</dt><dd>Auf <b>console.cloud.google.com</b> mit deinem Google-Konto anmelden. Oben auf die Projektauswahl tippen, „Neues Projekt“, Name „Merkn“, Erstellen. Danach sicherstellen, dass oben „Merkn“ ausgewählt ist.</dd><dt>2. Drive erlauben</dt><dd>Menü ☰ → „APIs und Dienste“ → „Bibliothek“. Nach „Google Drive API“ suchen und „Aktivieren“ tippen.</dd><dt>3. Anmeldeseite einrichten</dt><dd>Menü ☰ → „Google Auth Platform“ (heißt manchmal noch „OAuth-Zustimmungsbildschirm“) → „Jetzt starten“. App-Name „Merkn“, deine E-Mail als Support-Adresse, Zielgruppe <b>Extern</b>, deine E-Mail als Kontakt, zustimmen, Erstellen.</dd><dt>4. Dich als Tester eintragen</dt><dd>Dort unter „Zielgruppe“ → „Testnutzer“ → „Nutzer hinzufügen“ → deine Gmail-Adresse eintragen und speichern.</dd><dt>5. Schlüssel für Merkn erzeugen</dt><dd>Unter „Clients“ → „Client erstellen“. Anwendungstyp <b>Webanwendung</b>, Name „Merkn“. Bei „Autorisierte JavaScript-Quellen“ <b>https://hnnssth.github.io</b> eintragen (ohne /merkn am Ende). Erstellen.</dd><dt>6. In Merkn eintragen</dt><dd>Die angezeigte <b>Client-ID</b> kopieren (endet auf .apps.googleusercontent.com) und oben in das Feld einfügen. Das Client-Secret brauchst du nicht.</dd><dt>7. Erstes Backup</dt><dd>„Backup in Drive“ tippen und mit Google anmelden. Google warnt, die App sei nicht überprüft: Das ist normal, weil es deine eigene App ist. „Weiter“ tippen und den Zugriff erlauben. Danach reicht ein Tipp.</dd><dt>Gut zu wissen</dt><dd>Merkn darf nur Dateien sehen, die es selbst angelegt hat, nicht den Rest deines Drive. Die Backups liegen im Ordner „Merkn Backups“. Alte Backups löschst du bei Bedarf selbst in Drive. Die Client-ID ist kein Geheimnis; sie wird über GitHub auf deine anderen Geräte übernommen. Fragt Google nach einiger Zeit erneut nach der Anmeldung, liegt das am Testmodus; unter „Zielgruppe“ → „App veröffentlichen“ entfällt das in der Regel.</dd></dl></details>
    </section><section class="ssec" id="st-hilfe"><h3>Hilfe</h3>
    <details class="help"><summary>Merkn an Freunde weitergeben</summary><dl><dt>1. Installieren</dt><dd>Link <b>hnnssth.github.io/merkn</b> schicken. <b>Android:</b> in Chrome öffnen, ⋮ antippen, „App installieren“ oder „Zum Startbildschirm hinzufügen“. <b>iPhone:</b> in Safari öffnen, Teilen-Symbol, „Zum Home-Bildschirm“. <b>Rechner:</b> in Chrome oder Edge das Installieren-Symbol in der Adresszeile.</dd><dt>2. Ohne Sync loslegen</dt><dd>Beim ersten Start „Erst mal ohne Sync“ wählen. Die Notizen bleiben dann nur auf diesem Gerät. Jeder hat seine eigenen Notizen, niemand sieht die eines anderen.</dd><dt>3. Sync zwischen Geräten (optional)</dt><dd>Wer Handy und Rechner abgleichen will, braucht ein kostenloses GitHub-Konto:<br>• Auf github.com anmelden und ein neues <b>privates</b> Repo anlegen, z. B. „merkn-daten“.<br>• Unter github.com/settings/personal-access-tokens einen <b>Fine-grained token</b> erstellen: nur dieses Repo auswählen, Berechtigung <b>Contents: Read and write</b>.<br>• In Merkn unter Einstellungen → GitHub Benutzername, Repo und Schlüssel eintragen und „Verbinden“ tippen.<br>• Auf jedem weiteren Gerät dasselbe eintragen.</dd><dt>Gut zu wissen</dt><dd>Updates kommen automatisch, einfach die App einmal schließen und neu öffnen. Der Schlüssel bleibt nur auf dem jeweiligen Gerät. Merkn läuft ohne KI und schickt nichts an Dritte, die Notizen liegen nur auf dem Gerät und im eigenen GitHub-Repo.</dd></dl><div class="row" style="justify-content:flex-start;margin:0 0 14px"><button class="btn" id="hShare">Link teilen</button></div></details><details class="help"><summary>Notizen anlegen und bearbeiten</summary><dl><dt>+ unten rechts</dt><dd>Neue Notiz. Am Rechner geht auch die Taste N.</dd><dt>Titel und Text</dt><dd>Wird beim Tippen gespeichert. Mit dem Pfeil oben links oder der Zurück-Geste schließt du die Notiz. Leere Notizen verschwinden von selbst.</dd><dt>Liste</dt><dd>Macht aus dem Text eine Checkliste. Abgehakte Punkte rutschen nach unten und lassen sich einklappen.</dd><dt>Bild, Audio, Diktat</dt><dd>Über die Leiste unten in der Notiz. Diktat schreibt mit, was du sprichst.</dd><dt>Anheften</dt><dd>Pinnadel oben in der Notiz. Angeheftete Notizen stehen oben in der Liste; der Bereich lässt sich mit dem Pfeil zuklappen.</dd><dt>Bereich</dt><dd>Der Knopf oben in der Notiz (Privat, Beruflich, Freelance). „auto“ heißt: Merkn sortiert selbst ein, nach den Wörtern unter Einstellungen → Einsortieren.</dd></dl></details><details class="help"><summary>Text gestalten</summary><dl><dt>Formatieren</dt><dd>Text markieren: unten erscheinen B, I, U und S für fett, kursiv, unterstrichen und durchgestrichen. Nochmal tippen entfernt die Formatierung. Im Text stehen dann Zeichen wie **fett**, *kursiv*, ++unterstrichen++ und ~~durchgestrichen~~; angezeigt wird es formatiert.</dd><dt>**fett**</dt><dd>Zwei Sternchen davor und dahinter.</dd><dt># Überschrift</dt><dd>Eine Raute und ein Leerzeichen am Zeilenanfang, ## für kleiner.</dd><dt>- Punkt</dt><dd>Strich und Leerzeichen am Zeilenanfang ergibt eine Aufzählung; Einrücken geht mit Leerzeichen.</dd><dt>Links</dt><dd>Webadressen werden kurz angezeigt und sind antippbar.</dd><dt>[[Titel]]</dt><dd>Link auf eine andere Notiz mit diesem Titel. Grau heißt: gibt es noch nicht, antippen legt sie an.</dd><dt>Zum Bearbeiten</dt><dd>Gestalteten Text einmal antippen, dann siehst du ihn wieder als normalen Text.</dd></dl></details><details class="help"><summary>Tags</summary><dl><dt>#wort im Text</dt><dd>Wird automatisch zum Tag. Umlaute bleiben erhalten.</dd><dt>Tag-Chips unter der Suche</dt><dd>Antippen filtert; mehrere antippen zeigt nur Notizen, die alle gewählten Tags haben. Gewählte rutschen nach vorn. Lange drücken macht einen Tag zum Favoriten (Stern); Favoriten stehen vorn und werden in jeder Notiz vorgeschlagen.</dd><dt>Tabs</dt><dd>Unter Einstellungen → Tabs bekommt ein Tag einen eigenen Reiter neben den Bereichen, z. B. Software.</dd></dl></details><details class="help"><summary>Suchen und filtern</summary><dl><dt>Suche</dt><dd>Durchsucht Titel, Text, Listen und Tags, dazu Archiv und Papierkorb. Treffer sind gelb markiert.</dd><dt>#tag</dt><dd>Sucht nur in Tags. #bucher findet auch #bücher.</dd><dt>hat:bild · hat:audio · hat:liste · hat:link</dt><dd>Nur Notizen mit Bildern, Aufnahmen, Checklisten oder Weblinks. Kombinierbar, z. B. „hat:bild #kamera“ oder „hat:audio 2025“. Auch in der Statistik unter „Inhalte“ antippbar.</dd><dt>2019</dt><dd>Eine Jahreszahl filtert nach dem Jahr.</dd><dt>20-24 uhr</dt><dd>Filtert nach der Uhrzeit, zu der eine Notiz entstanden ist.</dd><dt>Zeit</dt><dd>Der Knopf unter der Suche: Jahr, Zeitraum, Uhrzeit und Sortierung.</dd></dl></details><details class="help"><summary>In der Liste</summary><dl><dt>Wischen</dt><dd>Nach rechts oder links wischen löst eine Aktion aus, standardmäßig Anheften und Archivieren. Einstellen unter Einstellungen → Wischen.</dd><dt>Lange drücken</dt><dd>Eintrag 2 Sekunden halten: Er wackelt, dann fragt Merkn, ob er gelöscht werden soll.</dd><dt>Mehrere auswählen</dt><dd>Häkchen-Symbol oben. Dann Notizen antippen und gemeinsam taggen, verschieben, archivieren oder löschen.</dd><dt>Pfeil nach oben / unten</dt><dd>Erscheint, wenn du in einer langen Liste mehrmals in eine Richtung scrollst.</dd><dt>Alle anzeigen</dt><dd>Ganz unten, wenn die Liste länger als 150 Einträge ist.</dd></dl></details><details class="help"><summary>Archiv, Papierkorb, Verlauf</summary><dl><dt>Archiv</dt><dd>Über das ⋯-Menü einer Notiz oder per Wischen. Der Link „Archiv“ steht unten in der Liste.</dd><dt>Löschen</dt><dd>Legt die Notiz in den Papierkorb, 5 Sekunden lang lässt sich das rückgängig machen. Nach 30 Tagen wird sie endgültig entfernt.</dd><dt>Papierkorb</dt><dd>Link unten in der Liste. Dort wiederherstellen, endgültig löschen oder leeren.</dd><dt>Verlauf</dt><dd>⋯-Menü einer Notiz. Zeigt frühere Fassungen von GitHub und holt eine zurück. Braucht Internet.</dd></dl></details><details class="help"><summary>Bäume</summary><dl><dt>Als Baum anzeigen</dt><dd>⋯-Menü einer Notiz. Eingerückte Zeilen mit „- Name“ werden zu einem aufklappbaren Baum.</dd><dt>Kopieren im Baum</dt><dd>Einen Eintrag antippen kopiert seinen Namen. Das „i“ zeigt Infos und Link; einen Wert dort antippen kopiert ihn.</dd><dt>Hinzufügen im Baum</dt><dd>Das + neben einem Ast legt einen Eintrag darunter an, auf Wunsch mit Link und Kästchen. „+ Neuer Ast“ unter dem Baum legt einen neuen Ast an, z. B. eine Person.</dd><dt>Umbenennen und löschen im Baum</dt><dd>Eintrag lange drücken (am PC: Rechtsklick): Namen, Link und Kästchen ändern oder den Eintrag löschen, samt allem darunter. Löschen lässt sich rückgängig machen.</dd><dt>Abhaken im Baum</dt><dd>„- [ ] Name“ macht einen Eintrag abhakbar, „- [x] Name“ ist erledigt. Äste zeigen, wie viel darunter erledigt ist, z. B. 3/10.</dd><dt>Eigenschaften</dt><dd>Unter einem Eintrag z. B. „version: 1.0“, „status: Fertig“, „info: …“, „link: …“, „seit: …“, „stand: …“, „bild: …“.</dd></dl></details><details class="help"><summary>Werkzeuge</summary><dl><dt>Gedichte finden</dt><dd>Einstellungen → Allgemein. Sucht gereimte Notizen und vergibt nach deiner Prüfung #lyrik.</dd><dt>Zitate finden</dt><dd>Einstellungen → Allgemein. Sucht Notizen mit Anführungszeichen und vergibt nach deiner Prüfung #zitat.</dd><dt>An Claude übergeben</dt><dd>Pfeil-Symbol oben kopiert alle Notizen der aktuellen Ansicht; im ⋯-Menü einer Notiz nur diese.</dd><dt>Von Claude übernehmen</dt><dd>Einstellungen → Allgemein. Fügt ein, was Claude geschrieben hat. „Inhalt ersetzen“ im ⋯-Menü ersetzt eine Notiz.</dd><dt>Doppelte finden</dt><dd>Einstellungen → Allgemein. Findet Notizen mit gleichem oder fast gleichem Inhalt; die neueste bleibt, die anderen kommen nach deiner Prüfung in den Papierkorb.</dd><dt>Tags umbenennen und teilen</dt><dd>Einstellungen → Tags. Einen Tag antippen: umbenennen, mit einem anderen zusammenführen, alle Notizen damit als Sammlung teilen oder drucken.</dd><dt>Teilen</dt><dd>⋯-Menü einer Notiz öffnet das Teilen-Menü des Handys, z. B. für WhatsApp oder Mail.</dd><dt>Zufällig blättern</dt><dd>„Zufällige Notiz“ antippen, dann dann die Notiz ziehen wie eine Karte: nach rechts = ja, sie wird gemerkt (#gemerkt); nach links = nein, die nächste kommt; nach unten = archivieren, sie taucht nicht mehr auf. Am PC: Pfeiltasten rechts, links, unten oder die Knöpfe oben. Keine Notiz kommt doppelt, bis alle einmal dran waren.</dd><dt>Heute vor … Jahren</dt><dd>Oben in der Liste „Alle“ erscheint eine Notiz von diesem Tag in einem früheren Jahr, daneben „Zufällige Notiz“. Ein- und ausschalten unter Einstellungen → Aussehen.</dd><dt>Kalender</dt><dd>In der Statistik: ein Kästchen pro Tag, je dunkler, desto mehr geschrieben. Mit ‹ › das Jahr wechseln, einen Tag antippen zeigt seine Notizen.</dd><dt>Lesemodus</dt><dd>⋯-Menü einer Notiz: große Schrift ohne Knöpfe, mit A− und A+ einstellbar. Oben links eine Stoppuhr: antippen startet und pausiert, ↺ setzt zurück; daneben die geschätzte Dauer beim Vorlesen. Abschaltbar unter Einstellungen → Aussehen. Mit X oder der Zurück-Geste schließen.</dd><dt>Statistik</dt><dd>Balken-Symbol oben: wie viele Notizen, zu welcher Tageszeit, an welchem Wochentag, in welchem Monat und Jahr sie entstanden sind, verteilt auf die Bereiche. Antippen eines Balkens filtert die Liste.</dd><dt>Tag- und Wort-Wolke</dt><dd>In der Statistik. Zeigt Tags oder häufige Wörter, sortiert nach Anzahl der Notizen, je größer desto häufiger. Bezieht sich auf den gerade gewählten Bereich. Antippen sucht danach.</dd><dt>Schrift</dt><dd>Einstellungen → Aussehen: Notizen mit oder ohne Serifen anzeigen. Gilt für Liste, Notiz, Baum und Lesemodus, pro Gerät.</dd><dt>Rechtschreibprüfung</dt><dd>Einstellungen → Aussehen oder im ⋯-Menü einer Notiz. Unterstreicht Tippfehler in Titel, Text und Listen, in Deutsch, Englisch und weiteren Sprachen. Merkn nutzt dafür die Prüfung von Browser bzw. Handy; die gewünschte Sprache muss dort eingeschaltet sein. Gilt pro Gerät.</dd><dt>Schnellnotiz</dt><dd>Das Feld ganz oben in der Liste: tippen, Enter, die Notiz ist gespeichert, ohne den Editor zu öffnen. Abschaltbar unter Einstellungen → Aussehen.</dd><dt>Zusammenführen</dt><dd>In der Mehrfachauswahl: mehrere Notizen werden zu einer, mit allen Texten, Listen, Tags und Bildern. Die älteste bleibt, die anderen kommen in den Papierkorb. Lässt sich rückgängig machen.</dd><dt>Aufräumen</dt><dd>Sind Checklisten seit drei Wochen komplett abgehakt, schlägt Merkn oben in „Alle“ vor, sie zu archivieren. „Später“ blendet den Hinweis eine Woche aus.</dd><dt>Schriftgröße</dt><dd>Einstellungen → Aussehen: Klein, Normal, Groß oder Sehr groß für die ganze App, pro Gerät.</dd><dt>Backup erstellen</dt><dd>Einstellungen → Backup: „Backup in Drive“ speichert direkt in Google Drive (einmalige Einrichtung, Anleitung dort), „Als Datei teilen“ geht ohne Einrichtung. Packt alle Notizen, Bilder und Aufnahmen in eine ZIP-Datei und öffnet das Teilen-Menü, z. B. „In Drive speichern“. Nach 30 Tagen ohne Backup erinnert Merkn einmal daran. Zurückholen: ZIP entpacken und mit „Ordner importieren“ einlesen.</dd><dt>Ordner importieren</dt><dd>Einstellungen → Allgemein. Liest einen Ordner mit Notiz-Dateien ein, z. B. aus Google Keep.</dd></dl></details><details class="help"><summary>Sync und Tastatur</summary><dl><dt>Punkt oben</dt><dd>Grün: alles synchron. Orange: Änderungen warten. Rot: Fehler, antippen für Details. Grau: nicht mit GitHub verbunden. Antippen synchronisiert sofort.</dd><dt>GitHub</dt><dd>Notizen liegen in deinem privaten Repo. Der Schlüssel bleibt nur auf diesem Gerät.</dd><dt>⌘K / Strg+K</dt><dd>Springt in die Suche.</dd><dt>N</dt><dd>Neue Notiz.</dd><dt>Esc</dt><dd>Schließt die offene Notiz.</dd></dl></details>
    <p class="hint" style="margin-top:18px">Merkn ${APP_VERSION}</p></section>`, d => {
    d.classList.add("settings");
    const nav = d.querySelector(".snav"), chips = [...d.querySelectorAll("[data-sec]")];
    const mark = k => chips.forEach(c => c.setAttribute("aria-pressed", String(c.dataset.sec === k)));
    let jumping = false, jt;
    chips.forEach(c => c.onclick = () => {
      const sec = d.querySelector("#st-" + c.dataset.sec); mark(c.dataset.sec); jumping = true; clearTimeout(jt);
      d.scrollTo({top: sec.offsetTop - nav.offsetHeight - 6, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
      jt = setTimeout(() => jumping = false, 700);
      const sc = c.parentElement; if (c.offsetLeft + c.offsetWidth > sc.scrollLeft + sc.clientWidth || c.offsetLeft < sc.scrollLeft) sc.scrollLeft = c.offsetLeft - 22;
    });
    d.addEventListener("scroll", () => {
      if (jumping) return;
      const y = d.scrollTop + nav.offsetHeight + 24; let cur = SECS[0][0];
      for (const [k] of SECS) { const sec = d.querySelector("#st-" + k); if (sec.offsetTop <= y) cur = k; }
      if (d.scrollTop + d.clientHeight >= d.scrollHeight - 4) cur = SECS[SECS.length-1][0];
      mark(cur);
    }, {passive:true});
    d.querySelectorAll("[data-sw]").forEach(b => b.onclick = () => { S.settings[b.dataset.sw] = b.dataset.act; S.settings._dirty = true; persist(); scheduleSync(800); d.querySelectorAll(`[data-sw="${b.dataset.sw}"]`).forEach(x => x.setAttribute("aria-pressed", String(x === b))); });
    d.querySelectorAll(".theme").forEach(b => b.onclick = () => { applyTheme(b.dataset.theme); d.querySelectorAll(".theme").forEach(x => x.setAttribute("aria-pressed", String(x === b))); });
    d.querySelector("#sImport").onclick = () => { closeDialog(); importDialog(); };
    d.querySelector("#sPoems").onclick = () => { closeDialog(); findDialog("lyrik"); };
    d.querySelector("#sQuotes").onclick = () => { closeDialog(); findDialog("zitat"); };
    d.querySelector("#hShare").onclick = () => shareText("Merkn", "Merkn – minimalistische Notizen-App ohne KI. Im Browser öffnen und zum Startbildschirm hinzufügen:\nhttps://hnnssth.github.io/merkn/");
    d.querySelectorAll("[data-zoom]").forEach(b => b.onclick = () => { const z = b.dataset.zoom; document.documentElement.style.setProperty("--zoom", z); try { localStorage.setItem("merkn-zoom", z); } catch {} d.querySelectorAll("[data-zoom]").forEach(x => x.setAttribute("aria-pressed", x === b)); });
    d.querySelectorAll("[data-font]").forEach(b => b.onclick = () => { const f = b.dataset.font; document.documentElement.dataset.font = f; try { localStorage.setItem("merkn-font", f); } catch {} d.querySelectorAll("[data-font]").forEach(x => x.setAttribute("aria-pressed", x === b)); });
    d.querySelector("#sQuick").onchange = e => { try { localStorage.setItem("merkn-quick", e.target.checked ? "an" : "aus"); } catch {} render(); };
    d.querySelector("#sRdTimer").onchange = e => { try { localStorage.setItem("merkn-rd-timer", e.target.checked ? "an" : "aus"); } catch {} };
    d.querySelector("#sSpell").onchange = e => { try { localStorage.setItem("merkn-spell", e.target.checked ? "an" : "aus"); } catch {} d.querySelector("#spellOpts").hidden = !e.target.checked; };
    d.querySelector("#sSpellLang").onchange = e => { try { localStorage.setItem("merkn-spell-lang", e.target.value); } catch {} };
    d.querySelector("#sRd").onchange = e => { try { localStorage.setItem("merkn-rd", e.target.checked ? "an" : "aus"); } catch {} render(); };
    d.querySelector("#sBackup").onclick = () => d.querySelector('[data-sec="backup"]')?.click();
    d.querySelector("#bDrive").onclick = () => { const v = d.querySelector("#gClient").value.trim(); if (v !== gClient()) { S.settings.gClientId = v; S.settings._dirty = true; persist(); scheduleSync(800); } if (!v) return toast("Bitte zuerst die Client-ID eintragen."); closeDialog(); backupToDrive(); };
    d.querySelector("#bFile").onclick = () => { closeDialog(); backupNow(); };
    d.querySelector("#gClient").onchange = e => { S.settings.gClientId = e.target.value.trim(); S.settings._dirty = true; persist(); scheduleSync(800); if (S.settings.gClientId) loadGIS().catch(() => {}); };
    if (gClient()) loadGIS().catch(() => {});
    d.querySelector("#sDups").onclick = () => { closeDialog(); dupDialog(); };
    d.querySelectorAll("[data-tagrow]").forEach(b => b.onclick = () => { closeDialog(); tagDialog(b.dataset.tagrow); });
    d.querySelector("#sFolder").onclick = () => { closeDialog(); $("#dfile").click(); };
    const ss = d.querySelector("#sSync"); if (ss) ss.onclick = () => { sync(); closeDialog(); };
    d.querySelector("#sConn").onclick = () => saveConnection("s");
    const off = d.querySelector("#sOff"); if (off) off.onclick = () => confirmDialog("GitHub trennen?", "Die Notizen bleiben auf diesem Gerät und im Repo. Es wird nur nicht mehr synchronisiert.", "Trennen", async () => { S.cfg = null; await idb.del("cfg"); setStatus("local"); render(); });
    d.querySelector("#sDone").onclick = () => {
      const next = {}; for (const a of AREAS) next[a] = d.querySelector(`#kw-${a}`).value.split(",").map(s => s.trim()).filter(Boolean);
      const fb = d.querySelector("#fb").value;
      const fav = [...new Set(d.querySelector("#favIn").value.split(/[\s,]+/).map(t => tagNorm(t)).filter(Boolean))];
      const tabs = [...new Set(d.querySelector("#tabIn").value.split(/[\s,]+/).map(t => tagNorm(t)).filter(Boolean))];
      if (JSON.stringify(tabs) !== JSON.stringify(tabTags())) { S.settings.tabTags = tabs; S.settings._dirty = true; if (S.view.area.startsWith("tag:") && !tabs.includes(S.view.area.slice(4))) S.view.area = "alle"; persist(); scheduleSync(500); }
      if (JSON.stringify(fav) !== JSON.stringify(favTags())) { S.settings.favTags = fav; S.settings._dirty = true; persist(); scheduleSync(500); }
      if (JSON.stringify(next) !== JSON.stringify(S.settings.keywords) || fb !== S.settings.fallback) {
        S.settings.keywords = next; S.settings.fallback = fb; S.settings._dirty = true;
        for (const n of S.notes.values()) if (n.areaAuto && !n._deleted) { const a = classify(n); if (a !== n.area) { n.area = a; n._dirty = true; n._rev = (n._rev||0)+1; } }
        persist(); scheduleSync(500);
      }
      closeDialog(); render();
    };
  });
}

/* ---------- Tastatur ---------- */
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); if (S.open) closeEditor(); setTimeout(() => $("#q")?.focus(), 0); }
  else if (e.key === "Escape" && document.getElementById("reader")) closeReader();
  else if (S.shuffle && S.open && !$("#dlg") && !document.activeElement?.matches?.("textarea,input") && ["ArrowRight","ArrowLeft","ArrowDown"].includes(e.key)) { e.preventDefault(); ({ArrowRight:shuffleLike, ArrowLeft:shuffleNext, ArrowDown:shuffleArchive})[e.key](); }
  else if (e.key === "Escape" && S.open && !popEl && !$("#dlg") && !$(".viewer")) closeEditor();
  else if (e.key === "n" && !S.open && !$("#dlg") && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && !S.welcome) { e.preventDefault(); openNote(newNote(), true); }
});
let lastY = 0;
window.addEventListener("scroll", () => { const y = scrollY, f = $("#new"); if (f) f.classList.toggle("tuck", y > lastY + 4 && y > 200); if (y < lastY - 4 || y < 200) f?.classList.remove("tuck"); lastY = y; }, {passive:true});
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") scheduleSync(200); else if (S.open && S.open._edited) { S.open._edited = false; if (!isEmpty(S.open)) touch(S.open); } });
window.addEventListener("online", () => scheduleSync(200));
setInterval(() => { if (document.visibilityState === "visible") scheduleSync(0); }, 120000);
document.addEventListener("paste", e => { if (!S.open) return; const fs = [...(e.clipboardData?.files || [])]; const f = fs.filter(x => x.type.startsWith("image/")), a = fs.filter(x => x.type.startsWith("audio/")); if (f.length || a.length) { e.preventDefault(); if (f.length) addImages(f); if (a.length) addAudioFiles(a); } });

/* ---------- Start ---------- */
// Nach oben / nach unten: erscheint, wenn man in einer langen Liste mehrmals in eine Richtung scrollt
{ let lastY = 0, up = 0, down = 0;
  const mk = (id, label, path) => { const b = document.createElement("button"); b.id = id; b.className = "jumpbtn"; b.setAttribute("aria-label", label);
    b.innerHTML = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${path}"/></svg>`; return b; };
  const ub = mk("upbtn", "Nach oben", "M12 19V5M6 11l6-6 6 6"), db = mk("downbtn", "Nach unten", "M12 5v14M6 13l6 6 6-6");
  const smooth = () => matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth";
  ub.onclick = () => { window.scrollTo({top:0, behavior:smooth()}); ub.classList.remove("on"); up = down = 0; };
  db.onclick = () => { window.scrollTo({top:document.documentElement.scrollHeight, behavior:smooth()}); db.classList.remove("on"); up = down = 0; };
  const add = () => document.body && document.body.append(ub, db); add(); document.addEventListener("DOMContentLoaded", add);
  addEventListener("scroll", () => {
    const y = scrollY, dy = y - lastY, max = document.documentElement.scrollHeight - innerHeight; lastY = y;
    if (dy < 0) { up -= dy; down = 0; } else if (dy > 0) { down += dy; up = 0; }
    const free = !S.open && !S.sel && !$("#dlg");
    ub.classList.toggle("on", free && y > 900 && up > 250);
    db.classList.toggle("on", free && max - y > 900 && down > 1200 && !ub.classList.contains("on"));
  }, {passive:true});
}
(async function init(){
  try {
    const [notes, cfg, settings, queue, welcomed] = await Promise.all([idb.get("notes"), idb.get("cfg"), idb.get("settings"), idb.get("queue"), idb.get("welcomed")]);
    (notes || []).forEach(n => S.notes.set(n.id, n));
    // Reparatur: Bäume, die eine ältere Version als Text gespeichert hat („Typ: Baum“ steht noch im Text)
    for (const n of S.notes.values()) if (n.kind !== "tree" && /^Typ:\s*Baum\s*$/mi.test(n.body || "")) {
      n.kind = "tree"; n.body = n.body.split("\n").filter(l => !/^Typ:\s*Baum\s*$/i.test(l) && !/^\s*```/.test(l)).join("\n").trim();
      n._dirty = true; n._rev = (n._rev || 0) + 1;
    }
    if (settings) S.settings = {...S.settings, ...settings};
    if (queue) { S.pendingImg = queue.pendingImg || []; S.deleteImg = queue.deleteImg || []; }
    S.cfg = cfg || null; S.welcome = !cfg && !welcomed;
  } catch (e) { console.warn("Speicher nicht verfügbar", e); }
  applyTheme(document.documentElement.dataset.theme || "auto");
  purgeTrash();
  // Einmalig: Bäume mit Häkchen, die eine Version vor 1.28 zerlegt hat (Häkchen als Checkliste unter dem Baum),
  // frisch von GitHub holen. Die lokale, kaputte Fassung wird dabei verworfen.
  if (!localStorage.getItem("merkn-tree-refetch") && S.cfg) {
    let k = 0;
    for (const n of S.notes.values()) if (!n._deleted && n.kind === "tree" && n.items.length && n._sha) { n._sha = "neu-laden"; n._dirty = false; k++; }
    if (k) persist();
    try { localStorage.setItem("merkn-tree-refetch", "1"); } catch {}
  }
  // Einmalig: Tags, die früher ohne Umlaut gespeichert wurden, aus dem Text wiederherstellen
  if (!localStorage.getItem("merkn-umlaut-fix")) {
    const map = {};
    const re = /(^|[\s(])#([\p{L}\p{N}_-]{2,})/gu;
    for (const n of S.notes.values()) { if (n._deleted || !n.tags.length) continue;
      const src = n.title + "\n" + n.body + "\n" + n.items.map(i => i.t).join("\n"); let m, changed = false; re.lastIndex = 0;
      while ((m = re.exec(src))) { const t = tagNorm(m[2]), old = norm(t);
        if (old !== t && n.tags.includes(old)) { n.tags = [...new Set(n.tags.map(x => x === old ? t : x))]; map[old] = t; changed = true; } }
      if (changed) { n._dirty = true; n._rev = (n._rev||0) + 1; } }
    if (Object.keys(map).length) { const fx = l => [...new Set((l||[]).map(t => map[t] || t))];
      S.settings.favTags = fx(S.settings.favTags); if (S.settings.tabTags) S.settings.tabTags = fx(S.settings.tabTags); S.settings._dirty = true; persist(); }
    try { localStorage.setItem("merkn-umlaut-fix", "1"); } catch {}
  }
  S.ready = true; setStatus(S.cfg ? "pending" : "local"); render();
  backupReminder();
  if (gClient()) setTimeout(() => loadGIS().catch(() => {}), 3000);
  if (S.cfg) sync();
  checkShareInbox();
  if (location.search.includes("share")) history.replaceState(null, "", location.pathname);
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    const had = !!navigator.serviceWorker.controller; let reloaded = false;
    navigator.serviceWorker.register("sw.js", {updateViaCache:"none"}).then(reg => {
      reg.update().catch(() => {});
      document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reg.update().catch(() => {}); });
    }).catch(() => {});
    // Neue Version übernimmt: einmal neu laden, aber nicht mitten im Schreiben
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (!had || reloaded) return; reloaded = true;
      if (S.open || $("#dlg")) toast("Neue Version ist da.", "Neu laden", () => location.reload()); else location.reload();
    });
  }
})();
