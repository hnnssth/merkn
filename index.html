<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Merkn</title>
<meta name="theme-color" content="#F2F4F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141917" media="(prefers-color-scheme: dark)">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("merkn-theme")||"auto";document.documentElement.dataset.font=localStorage.getItem("merkn-font")||"sans";document.documentElement.style.setProperty("--zoom",localStorage.getItem("merkn-zoom")||"1")}catch(e){document.documentElement.dataset.theme="auto"}</script>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png?v=2">
<link rel="apple-touch-icon" href="icons/icon-192.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F1; --sheet:#F7F8F6; --ink:#1B2420; --muted:#67716C; --faint:#9AA39E; --line:#DCE0DB;
  --privat:#4F8A5B; --beruflich:#3556A8; --freelance:#C47D16;
  --area:var(--ink); --danger:#B3402F;
  --display:"Bricolage Grotesque", system-ui, sans-serif;
  --text:"Instrument Sans", system-ui, sans-serif;
  --nfd:var(--display); --nft:var(--text); /* Schrift für Notizinhalte */
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root[data-theme="auto"]{ --bg:#141917; --sheet:#1A201D; --ink:#E4E9E6; --muted:#97A19C; --faint:#69736E; --line:#2A322E; --privat:#7BB487; --beruflich:#86A2E8; --freelance:#E3A84A; --danger:#E07A66; color-scheme:dark; } }
:root[data-theme="nacht"]{ --bg:#141917; --sheet:#1A201D; --ink:#E4E9E6; --muted:#97A19C; --faint:#69736E; --line:#2A322E; --privat:#7BB487; --beruflich:#86A2E8; --freelance:#E3A84A; --danger:#E07A66; color-scheme:dark; }
:root[data-theme="schiefer"]{ --bg:#EEF1F5; --sheet:#F6F8FA; --ink:#18202B; --muted:#5F6B7A; --faint:#98A2AF; --line:#D6DCE4; --privat:#3F8F7A; --beruflich:#3A5FCD; --freelance:#C26A1B; }
:root[data-theme="leinen"]{ --bg:#F3EFE7; --sheet:#F8F5EF; --ink:#2A2420; --muted:#756A60; --faint:#A69B90; --line:#E0D8CC; --privat:#5E8A55; --beruflich:#3E5C9A; --freelance:#B8742A; }
:root[data-theme="tinte"]{ --bg:#0F1522; --sheet:#151C2B; --ink:#E3E8F2; --muted:#96A1B5; --faint:#5E6A80; --line:#243047; --privat:#6FC2A0; --beruflich:#8DA8FF; --freelance:#F0B35A; --danger:#F08A78; color-scheme:dark; }
:root[data-theme="kontrast"]{ --bg:#FFFFFF; --sheet:#FFFFFF; --ink:#000000; --muted:#3D3D3D; --faint:#6E6E6E; --line:#C9C9C9; --privat:#1F7A3A; --beruflich:#1D4ED8; --freelance:#A84F06; }
.themes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 6px;align-items:start}
.thauto{grid-column:1 / -1}.thauto .theme{width:100%}
.theme small{font-size:12px;color:var(--muted);font-weight:400;margin-top:-4px}
.thcol{display:flex;flex-direction:column;gap:8px}
.thh{font-size:12px;color:var(--faint);margin:6px 0 0!important}
.sgh{font-size:13px;font-weight:600;color:var(--muted);margin:16px 0 8px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sgrid .btn{width:100%;justify-content:center;text-align:center;white-space:normal;line-height:1.25;min-height:46px}
.theme{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);text-align:left;font-size:14px;font-weight:500}
.theme[aria-pressed="true"]{border-color:var(--ink)}
.theme .sw{display:flex;align-items:center;gap:4px;padding:6px 8px;border-radius:8px;width:100%}
.theme .sw i{width:10px;height:10px;border-radius:50%}
.theme .sw b{flex:1;height:4px;border-radius:2px;margin-left:4px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:color-mix(in srgb, var(--area) 4%, var(--bg));color:var(--ink);font:400 16px/1.5 var(--text);transition:background-color .35s ease;min-height:100vh}
body[data-area="alle"]{--area:var(--ink)}
body[data-area="privat"]{--area:var(--privat)}
body[data-area="beruflich"]{--area:var(--beruflich)}
body[data-area="freelance"]{--area:var(--freelance)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--area);outline-offset:2px;border-radius:4px}
.wrap{max-width:680px;margin:0 auto;padding:calc(14px + var(--safe-t)) 20px calc(110px + var(--safe-b))}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Kopf */
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.mark{font:650 26px/1 var(--display);letter-spacing:-.02em;margin:0;flex:1}
.mark span{color:var(--area);transition:color .35s}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;border-radius:20px;color:var(--muted)}
.iconbtn:hover{background:color-mix(in srgb,var(--ink) 6%,transparent);color:var(--ink)}
.iconbtn svg{width:21px;height:21px}
.status{width:9px;height:9px;border-radius:50%;background:var(--faint)}
.status[data-s="ok"]{background:var(--privat)}
.status[data-s="pending"],.status[data-s="sync"]{background:var(--freelance)}
.status[data-s="sync"]{animation:pulse 1s ease-in-out infinite}
.status[data-s="err"]{background:var(--danger)}
@keyframes pulse{50%{opacity:.35}}

.search{display:flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--ink) 5%,transparent);border-radius:12px;padding:0 12px;height:46px}
.search svg{width:18px;height:18px;color:var(--faint);flex:none}
.search input{flex:1;border:0;background:none;outline:none;height:100%;font-size:16px;min-width:0}
.search input::placeholder{color:var(--faint)}
.search kbd{font:500 12px var(--text);color:var(--faint);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
@media (hover:none){.search kbd{display:none}}

/* Bereiche: das eine laute Element */
.areas{display:flex;gap:22px;margin:22px 0 4px;overflow-x:auto;scrollbar-width:none}
.areas::-webkit-scrollbar{display:none}
.area{font:500 21px/1.1 var(--display);letter-spacing:-.015em;color:var(--faint);padding:2px 0 10px;position:relative;white-space:nowrap;transition:color .2s}
.area sup{font:500 11px var(--text);margin-left:3px;letter-spacing:0;vertical-align:super}
.area::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:2px;background:var(--c,var(--ink));transform:scaleX(0);transform-origin:left;transition:transform .25s ease}
.area[aria-pressed="true"]{color:var(--ink);font-weight:650}
.area[aria-pressed="true"]::after{transform:scaleX(1)}
.area:hover{color:var(--ink)}
.area[data-a="privat"]{--c:var(--privat)}.area[data-a="beruflich"]{--c:var(--beruflich)}.area[data-a="freelance"]{--c:var(--freelance)}

.tags{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:10px 0 6px;margin:0 -20px;padding-left:20px;padding-right:20px}
.tags::-webkit-scrollbar{display:none}
.tag{flex:none;font:500 14px var(--text);color:var(--muted);padding:5px 11px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.tag[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Liste */
.group{font:500 13px var(--text);color:var(--faint);margin:18px 0 0}
.list{list-style:none;margin:0;padding:0}
.note{position:relative;display:grid;grid-template-columns:1fr auto;gap:12px;padding:15px 0 15px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.note::before{content:"";position:absolute;left:0;top:17px;bottom:17px;width:3px;border-radius:2px;background:var(--c)}
.note[data-a="privat"]{--c:var(--privat)}.note[data-a="beruflich"]{--c:var(--beruflich)}.note[data-a="freelance"]{--c:var(--freelance)}
.note:hover .nt{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
#app,#editor,.rdtext{zoom:var(--zoom,1)}
html[data-font="serif"]{--nfd:"Iowan Old Style","Charter","Source Serif 4","Noto Serif",Georgia,"Times New Roman",serif;--nft:"Iowan Old Style","Charter","Source Serif 4","Noto Serif",Georgia,"Times New Roman",serif}
.nt{font:650 17px/1.3 var(--nfd);letter-spacing:-.01em;margin:0 0 2px;overflow-wrap:anywhere}
.nt.untitled{color:var(--muted);font-weight:500}
.nb{color:var(--muted);font-size:15px;line-height:1.45;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.nm{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px;font-size:13px;color:var(--faint)}
.nm .prog{color:var(--muted);font-weight:600}
.nm .prog.done{color:var(--privat)}
.thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--line)}
.empty{color:var(--muted);padding:48px 0;max-width:34ch}
.empty strong{display:block;font:650 20px/1.3 var(--display);color:var(--ink);margin-bottom:6px}
.archivelink{display:block;margin:26px 0 0;color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:3px}

.fab{position:fixed;right:max(20px,calc(50vw - 320px));bottom:calc(22px + var(--safe-b));width:58px;height:58px;border-radius:29px;background:var(--ink);color:var(--bg);display:grid;place-items:center;box-shadow:0 6px 20px color-mix(in srgb,var(--ink) 25%,transparent);z-index:5}
.fab svg{width:26px;height:26px}

/* Editor */
.sheet{scroll-padding-top:64px;scroll-padding-bottom:84px;position:fixed;inset:0;background:var(--sheet);z-index:20;overflow-y:auto;overscroll-behavior:contain;animation:up .22s ease}
@keyframes up{from{transform:translateY(16px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.ed{max-width:680px;margin:0 auto;padding:calc(10px + var(--safe-t)) 20px calc(120px + var(--safe-b))}
.edtop{display:flex;align-items:center;gap:4px;position:sticky;top:0;background:var(--sheet);padding:4px 0 8px;z-index:2;margin:0 -6px}
.edtop .grow{flex:1}
.areabtn{display:flex;align-items:center;gap:7px;font:500 14px var(--text);padding:7px 12px;border-radius:999px;border:1px solid var(--line)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
[data-a="privat"]>.dot,.dot[data-a="privat"]{--c:var(--privat)}
[data-a="beruflich"]>.dot,.dot[data-a="beruflich"]{--c:var(--beruflich)}
[data-a="freelance"]>.dot,.dot[data-a="freelance"]{--c:var(--freelance)}
.areabtn small{color:var(--faint);font-size:12px}
.iconbtn[aria-pressed="true"]{color:var(--ink)}
.edtitle{display:block;width:100%;border:0;background:none;outline:none;font:650 27px/1.2 var(--nfd);letter-spacing:-.02em;padding:12px 0 6px;resize:none;overflow:hidden;field-sizing:content;color:var(--ink);overflow-wrap:anywhere}
.edtitle::placeholder,.edbody::placeholder{color:var(--faint)}
.edbody{width:100%;border:0;background:none;outline:none;resize:none;font-family:var(--nft);font-size:17px;line-height:1.6;min-height:120px;padding:4px 0;overflow:hidden}
.items{list-style:none;margin:8px 0;padding:0}
.item{display:flex;align-items:flex-start;gap:10px;padding:5px 0}
.item input[type=checkbox]{appearance:none;width:21px;height:21px;border:1.5px solid var(--muted);border-radius:6px;margin:3px 0 0;flex:none;display:grid;place-items:center;cursor:pointer}
.item input[type=checkbox]:checked{background:var(--area);border-color:var(--area)}
.item input[type=checkbox]:checked::after{content:"";width:6px;height:11px;border:solid var(--sheet);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.item textarea{flex:1;border:0;background:none;outline:none;resize:none;font-family:var(--nft);font-size:17px;line-height:1.5;padding:0;overflow:hidden;min-height:26px}
.item.done textarea{color:var(--faint);text-decoration:line-through}
.item .x{color:var(--faint);width:28px;height:28px;display:grid;place-items:center;opacity:0}
.item:hover .x,.item:focus-within .x{opacity:1}
.additem{display:block;color:var(--muted);font-size:16px;padding:6px 0 6px 31px}
.donetoggle{display:block;font-size:14px;color:var(--faint);margin:10px 0 2px}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin:14px 0}
.imgs button{aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--line)}
.imgs img{width:100%;height:100%;object-fit:cover;display:block}
.edtags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:18px 0 6px}
.chip{display:inline-flex;align-items:center;gap:2px;font:500 14px var(--text);color:var(--muted);padding:4px 6px 4px 11px;border-radius:999px;background:color-mix(in srgb,var(--ink) 6%,transparent)}
.chip button{width:20px;height:20px;border-radius:10px;display:grid;place-items:center;color:var(--faint)}
.taginput::-webkit-calendar-picker-indicator{display:none!important}
.taginput{border:0;background:none;outline:none;font-size:15px;min-width:130px;flex:1;padding:4px 2px}
.meta{color:var(--faint);font-size:13px;margin-top:22px}
.toolbar{position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-top:1px solid var(--line);padding:6px 14px calc(6px + var(--safe-b));display:flex;justify-content:center;gap:4px;z-index:21}
.toolbar button{display:flex;align-items:center;gap:7px;padding:9px 13px;border-radius:10px;color:var(--muted);font-size:14px}
.toolbar button:hover{background:color-mix(in srgb,var(--ink) 6%,transparent);color:var(--ink)}
.toolbar svg{width:20px;height:20px}
.toolbar .rec{color:var(--danger)}
.fmtbar{position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-top:1px solid var(--line);padding:6px 14px calc(6px + var(--safe-b));display:flex;justify-content:center;gap:6px;z-index:22}
.fmtbar button{min-width:52px;height:42px;border-radius:10px;font:18px/1 Georgia,serif;color:var(--ink);display:grid;place-items:center}
.fmtbar button:hover,.fmtbar button:active{background:color-mix(in srgb,var(--ink) 8%,transparent)}
body.fmting .toolbar{visibility:hidden}
.edbody.read em,.cb em,.nb em,.rdbody em{font-style:italic}
.nb strong{font-weight:650;color:var(--ink)}
.edbody.read u,.cb u,.nb u,.rdbody u{text-decoration-thickness:1px;text-underline-offset:3px}
.toolbar .rec svg{animation:pulse 1.1s infinite}
@media (max-width:420px){.area{font-size:16px}.area sup{display:none}.areas{gap:12px}.toolbar span{display:none}.toolbar button{padding:10px 14px}}

/* Menüs & Dialoge */
.pop{position:fixed;z-index:40;background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:6px;min-width:210px;box-shadow:0 12px 32px color-mix(in srgb,#000 18%,transparent)}
.pop button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:9px;font-size:15px}
.pop button:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.pop .danger{color:var(--danger)}
.pop svg{width:18px;height:18px;flex:none}
.pop hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
.scrim{position:fixed;inset:0;z-index:30;background:color-mix(in srgb,#000 45%,transparent)}
.scrim.clear{background:transparent}
.dialog{position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100vw - 32px));max-height:calc(100vh - 40px);max-height:calc(100dvh - 40px);overflow:auto;background:var(--sheet);border-radius:18px;padding:22px}
.dialog h2{font:650 21px/1.25 var(--display);margin:0 0 8px;letter-spacing:-.01em}
.dialog p{margin:0 0 14px;color:var(--muted);font-size:15px}
.dialog .row{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.btn{padding:10px 16px;border-radius:10px;font-weight:600;font-size:15px;border:1px solid var(--line)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
label.f{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
label.f small{font-weight:400;color:var(--muted)}
.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px;outline:none}
.inp:focus{border-color:var(--ink)}
textarea.inp{resize:vertical;min-height:90px;line-height:1.45}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.hint a,.dialog a{color:inherit}
.msg{font-size:14px;margin-top:10px}
.msg.err{color:var(--danger)}.msg.ok{color:var(--privat)}
.viewer{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column}
.viewer img{flex:1;min-height:0;object-fit:contain;width:100%}
.viewer .vbar{display:flex;justify-content:space-between;padding:calc(10px + var(--safe-t)) 14px 10px}
.viewer .vbar button{color:#fff;padding:8px 12px}
.auds{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.aud{display:flex;align-items:center;gap:8px}
.aud audio{flex:1;height:40px;min-width:0}
.aud .x{opacity:.7;width:32px;height:32px;display:grid;place-items:center;color:var(--faint)}
.recbar{position:fixed;left:0;right:0;bottom:calc(58px + var(--safe-b));display:flex;justify-content:center;z-index:22;pointer-events:none}
.recbar div{pointer-events:auto;display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--bg);padding:10px 12px 10px 16px;border-radius:999px;font-variant-numeric:tabular-nums}
.recbar i{width:10px;height:10px;border-radius:50%;background:var(--danger);animation:pulse 1s infinite}
.recbar button{background:var(--bg);color:var(--ink);font-weight:600;padding:6px 14px;border-radius:999px}
.note.compact{padding:11px 0 11px 16px;grid-template-columns:1fr}
.note.compact::before{top:13px;bottom:13px;opacity:.55}
.ts{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;margin:0 0 1px}
.cb{margin:0;font-family:var(--nft);font-size:15.5px;line-height:1.45;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.group.month{margin-top:24px;color:var(--muted);font-weight:600}
.more{display:block;margin:18px 0 0;padding:10px 14px;border:1px solid var(--line);border-radius:10px;color:var(--muted);font-size:14px}
.countline{color:var(--faint);font-size:13px;margin:0}
.endrow{display:flex;justify-content:space-between;align-items:center;margin:16px 0 0;padding-right:76px}
.totop{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:14px;font-weight:500}
.totop:hover{color:var(--ink);border-color:var(--ink)}
.timechip{display:inline-flex;align-items:center;gap:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tsec{margin-top:20px}.tsec label.f{margin:0 0 8px}
.tgrid{display:grid;gap:6px}
.tgrid .tag{justify-content:center;text-align:center;margin:0;min-width:0;font-variant-numeric:tabular-nums}
.tgrid.years{grid-template-columns:repeat(auto-fill,minmax(64px,1fr))}
.tgrid.hrs{grid-template-columns:repeat(auto-fill,minmax(118px,1fr))}
.tgrid.hrs small{color:var(--faint);font-size:inherit;margin-left:4px}
.tgrid.hrs .tag[aria-pressed="true"] small{color:inherit;opacity:.7}
.tgrid.two2{grid-template-columns:1fr 1fr}
.trange{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-top:8px}
.trange:has(> span:nth-of-type(2)){grid-template-columns:1fr auto 1fr auto}
.trange span{color:var(--muted);font-size:14px}
.trange .inp{min-width:0;min-height:44px}
.dialog .row.tbtns{display:grid;grid-template-columns:1fr 1fr;margin-top:22px}
.dialog p.hint.tsec{margin:18px 0 0}
.two>div{min-width:0}.two .inp{min-width:0;max-width:100%}
.tag.fav[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tag{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.chip.sugg{border:1px dashed var(--line);background:none;padding:4px 11px;color:var(--faint);cursor:pointer}

<script>
"use strict";
/* ---------- Grundlagen ---------- */
const APP_VERSION = "1.47";
const AREAS = ["privat","beruflich","freelance"];
const AREA_NAME = {alle:"Alle", privat:"Privat", beruflich:"Beruflich", freelance:"Freelance"};
const DEFAULT_KW = {

};
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/\p{M}/gu,"");
// Tags behalten Umlaute; zum Vergleichen wird gefaltet (bücher = bucher = buecher)
const tagNorm = s => String(s||"").toLowerCase().normalize("NFC").replace(/^#/, "").trim().replace(/\s+/g, "-");
const fold = s => norm(s).replace(/ß/g, "ss").replace(/ae/g, "a").replace(/oe/g, "o").replace(/ue/g, "u");
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const nowISO = () => new Date().toISOString();
const ICON = {
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>',

  more:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="m8 12 3 3 5-6"/></svg>',
  image:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="m21 16-5-5-9 9"/></svg>',
  hash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 9h15M4 15h15M10 3 8 21M16 3l-2 18"/></svg>',
  mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  wave:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4"/></svg>',
  clock:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="vertical-align:-2px"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  star:'<svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor" style="margin-right:4px;vertical-align:-1px" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>',
  pinSm:'<svg class="pinsm" viewBox="0 0 24 24" width="13" height="13" fill="currentColor" aria-label="angeheftet"><path d="M9 3h6l-1 6 3 4h-4v6l-1 2-1-2v-6H7l3-4z"/></svg>',
  x:'<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  sync:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.3-4.7L4 8M4 4v4h4M4 13a8 8 0 0 0 14.3 4.7L20 16M20 20v-4h-4"/></svg>'
};

/* ---------- Designs ---------- */
const THEMES = [
  ["auto","Automatisch",["#F2F4F1","#1B2420","#4F8A5B","#3556A8","#C47D16"]],
  ["kalk","Kalk",["#F2F4F1","#1B2420","#4F8A5B","#3556A8","#C47D16"]],
  ["nacht","Nacht",["#141917","#E4E9E6","#7BB487","#86A2E8","#E3A84A"]],
  ["schiefer","Schiefer",["#EEF1F5","#18202B","#3F8F7A","#3A5FCD","#C26A1B"]],
  ["leinen","Leinen",["#F3EFE7","#2A2420","#5E8A55","#3E5C9A","#B8742A"]],
  ["tinte","Tinte",["#0F1522","#E3E8F2","#6FC2A0","#8DA8FF","#F0B35A"]],
  ["kontrast","Kontrast",["#FFFFFF","#000000","#1F7A3A","#1D4ED8","#A84F06"]]
];
function applyTheme(t){
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem("merkn-theme", t); } catch {}
  const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => m.setAttribute("content", bg));
}

/* ---------- Lokaler Speicher (IndexedDB) ---------- */
const idb = (() => {
  let dbp;
  const open = () => dbp ||= new Promise((res, rej) => {
    const r = indexedDB.open("merkn", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  const tx = async (mode, fn) => { const d = await open(); return new Promise((res, rej) => {
    const t = d.transaction("kv", mode), req = fn(t.objectStore("kv"));
    t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error); }); };
  return { get:k => tx("readonly", s => s.get(k)), set:(k,v) => tx("readwrite", s => s.put(v,k)), del:k => tx("readwrite", s => s.delete(k)) };
})();

const S = {
  notes: new Map(), cfg: null, settings: {keywords: structuredClone(DEFAULT_KW), fallback:"privat", favTags:[], tabTags:["software"], swipeR:"pin", swipeL:"archive", _sha:null, _dirty:false},
  pendingImg: [], deleteImg: [],
  view: {area:"alle", tags:[], q:"", archive:false, from:"", to:"", h1:null, h2:null, sort:"created", limit:150},
  open: null, status:"local", statusMsg:"", lastSync:0, ready:false, welcome:false
};

let saveTimer;
function persist(){ clearTimeout(saveTimer); saveTimer = setTimeout(async () => {
  await idb.set("notes", [...S.notes.values()]);
  await idb.set("settings", S.settings);
  await idb.set("queue", {pendingImg:S.pendingImg, deleteImg:S.deleteImg});
}, 250); }

/* ---------- Markdown-Format ---------- */
function toMarkdown(n){
  const fm = {id:n.id, title:n.title, area:n.area, areaAuto:n.areaAuto, tags:n.tags, pinned:n.pinned, archived:n.archived, ...(n.trashed ? {trashed:true, trashedAt:n.trashedAt} : {}), created:n.created, updated:n.updated, images:n.images, audio:n.audio||[], ...(n.kind ? {kind:n.kind} : {})};
  let s = "---\n" + Object.entries(fm).map(([k,v]) => `${k}: ${JSON.stringify(v)}`).join("\n") + "\n---\n";
  if (n.body.trim()) s += n.body.trim() + "\n";
  if (n.items.length) s += (n.body.trim() ? "\n" : "") + n.items.map(i => `- [${i.d?"x":" "}] ${i.t.replace(/\n/g," ")}`).join("\n") + "\n";
  return s;
}
function fromMarkdown(text, fallbackId){
  let fm = {}, body = String(text).replace(/\r\n/g,"\n");
  const m = body.match(/^---\n([\s\S]*?)\n---\n?/);
  if (m) {
    body = body.slice(m[0].length);
    for (const line of m[1].split("\n")) {
      const i = line.indexOf(":"); if (i < 1) continue;
      const k = line.slice(0,i).trim(); let v = line.slice(i+1).trim();
      try { v = JSON.parse(v); } catch {
        if (/^\[.*\]$/.test(v)) v = v.slice(1,-1).split(",").map(x => x.trim().replace(/^["']|["']$/g,"")).filter(Boolean);
        else if (v === "true" || v === "false") v = v === "true";
        else v = v.replace(/^["']|["']$/g,"");
      }
      fm[k] = v;
    }
  }
  const items = [], lines = [], isTree = fm.kind === "tree" || /^Typ:\s*Baum\s*$/mi.test(body);
  for (const l of body.split("\n")) {
    const t = !isTree && l.match(/^\s*[-*] \[( |x|X)\]\s?(.*)$/);
    if (t) { items.push({t:t[2], d:t[1] !== " "}); continue; }
    const a = l.match(/^\s*Bereich:\s*(\S+)/i);
    if (a && !fm.area) { const v = norm(a[1]); fm.area = AREAS.find(x => v.startsWith(x.slice(0,4))); fm.areaAuto = false; continue; }
    if (/^Typ:\s*Baum\s*$/i.test(l)) { fm.kind = "tree"; continue; }
    const tg = l.match(/^\s*Tags:\s*(.*)$/i);
    if (tg && !fm.tags) { fm.tags = tg[1].split(/[\s,]+/).map(x => x.replace(/^#/,"")).filter(Boolean); continue; }
    lines.push(l);
  }
  let b = lines.join("\n").trim(), title = fm.title;
  if (title == null || title === "") {
    const h = b.match(/^#{1,3}\s+(.+)(\n|$)/);
    if (h) { title = h[1].trim(); b = b.slice(h[0].length).trim(); } else title = "";
  }
  const now = nowISO();
  const n = { id:String(fm.id || fallbackId || uid()), title:String(title), body:b, items,
    tags:Array.isArray(fm.tags) ? fm.tags.map(t => tagNorm(String(t))) : [],
    area:AREAS.includes(fm.area) ? fm.area : null, areaAuto:fm.areaAuto !== false,
    pinned:!!fm.pinned, archived:!!fm.archived, trashed:!!fm.trashed, trashedAt:fm.trashedAt || null, created:fm.created || now, updated:fm.updated || now,
    images:Array.isArray(fm.images) ? fm.images.map(String) : [], audio:Array.isArray(fm.audio) ? fm.audio.map(String) : [], kind: fm.kind === "tree" ? "tree" : "" };
  pullHashtags(n);
  if (!n.area) { n.area = classify(n); n.areaAuto = true; }
  return n;
}
function forClaude(n){
  let s = `# ${n.title || "Ohne Titel"}\nBereich: ${AREA_NAME[n.area]}` + (n.kind === "tree" ? "\nTyp: Baum" : "") + (n.tags.length ? `\nTags: ${n.tags.map(t => "#"+t).join(" ")}` : "") + "\n";
  if (n.body.trim()) s += "\n" + n.body.trim() + "\n";
  if (n.items.length) s += "\n" + n.items.map(i => `- [${i.d?"x":" "}] ${i.t}`).join("\n") + "\n";
  if (n.images.length) s += `\n(${n.images.length} Bild${n.images.length>1?"er":""} in der App)\n`;
  if ((n.audio||[]).length) s += `(${n.audio.length} Audioaufnahme${n.audio.length>1?"n":""} in der App)\n`;
  return s;
}
function claudeBundle(notes){
  const head = notes.length === 1
    ? "Hier ist eine Notiz aus meiner Notizen-App Merkn. Wenn du mir etwas zurückgibst, nutze bitte dasselbe Format (# Titel, Bereich, Tags, Text, Checkliste mit - [ ])."
    : `Hier sind ${notes.length} Notizen aus meiner Notizen-App Merkn, getrennt durch ---. Wenn du mir etwas zurückgibst, nutze bitte dasselbe Format (# Titel, Bereich, Tags, Text, Checkliste mit - [ ]).`;
  return head + "\n\n" + notes.map(forClaude).join("\n---\n\n");
}

/* ---------- Automatisch einsortieren (ohne KI) ---------- */
function pullHashtags(n){
  const re = /(^|[\s(])#([\p{L}\p{N}_-]{2,})/gu; let m;
  const src = n.title + "\n" + n.body + "\n" + n.items.map(i => i.t).join("\n");
  while ((m = re.exec(src))) { const t = tagNorm(m[2]), old = norm(t);
    if (old !== t && n.tags.includes(old)) n.tags = n.tags.map(x => x === old ? t : x); // früher ohne Umlaut gespeichert
    if (!n.tags.includes(t)) n.tags.push(t); }
}
function classify(n){
  const score = {privat:0, beruflich:0, freelance:0};
  const title = " " + norm(n.title) + " ";
  const text = " " + norm([n.body, n.items.map(i => i.t).join(" "), n.tags.join(" ")].join(" ")) + " ";
  for (const a of AREAS) for (const raw of (S.settings.keywords[a] || [])) {
    const k = norm(raw).trim(); if (!k) continue;
    const kk = k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    const re = k.length <= 3 ? new RegExp(`[^\\p{L}\\p{N}]${kk}[^\\p{L}\\p{N}]`,"u") : new RegExp(`[^\\p{L}\\p{N}]${kk}`,"u");
    if (re.test(title)) score[a] += 2;
    if (re.test(text)) score[a] += 1;
  }
  // Aus deinen Tags lernen: wo landet ein Tag sonst?
  if (n.tags.length) {
    const counts = {};
    for (const o of S.notes.values()) { if (o.id === n.id || o._deleted) continue;
      const w = o.areaAuto ? 1 : 3;
      for (const t of o.tags) { (counts[t] ||= {privat:0,beruflich:0,freelance:0})[o.area] += w; } }
    for (const t of n.tags) { const c = counts[t]; if (!c) continue;
      const tot = c.privat + c.beruflich + c.freelance;
      for (const a of AREAS) score[a] += 3 * c[a] / tot; }
  }
  let best = null, bs = 0;
  for (const a of AREAS) if (score[a] > bs) { bs = score[a]; best = a; }
  return best || S.settings.fallback || "privat";
}

/* ---------- Notizen ändern ---------- */
function newNote(extra={}){
  const now = nowISO();
  const n = {id:uid(), title:"", body:"", items:[], tags:[], area:null, areaAuto:true, pinned:false, archived:false, created:now, updated:now, images:[], audio:[], _sha:null, _dirty:false, _rev:0, ...extra};
  const va = S.view.area, isTab = va.startsWith("tag:");
  if (!n.area) n.area = va !== "alle" && !isTab ? va : (S.settings.fallback || "privat");
  if (va !== "alle" && !isTab && !extra.area) n.areaAuto = false;
  if (isTab && !extra.tags) n.tags = [va.slice(4)];
  if (S.view.tags.length && !extra.tags) n.tags = [...S.view.tags];
  return n;
}
function isEmpty(n){ return !n.title.trim() && !n.body.trim() && !n.items.some(i => i.t.trim()) && !n.images.length && !(n.audio||[]).length; }
function touch(n, {reclassify=true} = {}){
  n.updated = nowISO(); n._dirty = true; n._rev = (n._rev||0) + 1;
  if (reclassify) { pullHashtags(n); if (n.areaAuto) n.area = classify(n); }
  S.notes.set(n.id, n); persist(); setStatus(S.cfg ? "pending" : "local"); scheduleSync();
}
function trashNote(n){
  n.trashed = true; n.trashedAt = nowISO(); n.pinned = n.pinned; touch(n, {reclassify:false});
  toast("In den Papierkorb gelegt.", "Rückgängig", () => { n.trashed = false; n.trashedAt = null; touch(n, {reclassify:false}); render(); });
}
function purgeTrash(){ const lim = Date.now() - 30 * 864e5; for (const n of [...S.notes.values()]) if (n.trashed && n.trashedAt && Date.parse(n.trashedAt) < lim) removeNote(n); }
function removeNote(n){
  for (const p of [...n.images, ...(n.audio||[])]) S.deleteImg.push(p);
  if (n._sha) { n._deleted = true; n._dirty = true; } else S.notes.delete(n.id);
  persist(); scheduleSync();
}

/* ---------- GitHub-Synchronisation ---------- */
const b64ToBytes = b64 => Uint8Array.from(atob(b64.replace(/\s/g,"")), c => c.charCodeAt(0));
function bytesToB64(bytes){ let s = ""; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i+0x8000)); return btoa(s); }
const textToB64 = t => bytesToB64(new TextEncoder().encode(t));
const b64ToText = b => new TextDecoder().decode(b64ToBytes(b));

async function gh(path, opts={}, cfg=S.cfg){
  const r = await fetch(`https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}${path}`, {
    ...opts, cache:"no-store",
    headers:{Authorization:`Bearer ${cfg.token}`, Accept:"application/vnd.github+json", ...(opts.body ? {"Content-Type":"application/json"} : {}), ...(opts.headers||{})}
  });
  return r;
}
async function ghErr(r){ let m = ""; try { m = (await r.json()).message || ""; } catch {}
  if (r.status === 401) return "Der Zugangsschlüssel ist ungültig oder abgelaufen.";
  if (r.status === 403) return m.includes("rate limit") ? "GitHub-Limit erreicht. Später erneut versuchen." : "Keine Berechtigung. Prüfe, ob der Schlüssel Schreibrechte auf das Repo hat.";
  if (r.status === 404) return "Repo nicht gefunden. Prüfe Benutzername und Repo-Name.";
  return `GitHub-Fehler ${r.status}${m ? ": " + m : ""}`; }

async function fetchTree(){
  const r = await gh(`/git/trees/${encodeURIComponent(S.cfg.branch)}?recursive=1`);
  if (r.status === 409 || r.status === 404) { // leeres Repo oder Branch noch nicht da
    const rr = await gh(""); if (!rr.ok) throw new Error(await ghErr(rr));
    return new Map();
  }
  if (!r.ok) throw new Error(await ghErr(r));
  const j = await r.json(); const m = new Map();
  for (const e of j.tree) if (e.type === "blob") m.set(e.path, e.sha);
  return m;
}
async function fetchBlobText(sha){
  const r = await gh(`/git/blobs/${sha}`); if (!r.ok) throw new Error(await ghErr(r));
  const j = await r.json(); return b64ToText(j.content);
}
async function putFile(path, b64, sha, message){
  const body = {message, content:b64, branch:S.cfg.branch}; if (sha) body.sha = sha;
  return gh(`/contents/${path.split("/").map(encodeURIComponent).join("/")}`, {method:"PUT", body:JSON.stringify(body)});
}
async function deleteFile(path, sha, message){
  return gh(`/contents/${path.split("/").map(encodeURIComponent).join("/")}`, {method:"DELETE", body:JSON.stringify({message, sha, branch:S.cfg.branch})});
}

let syncing = false, again = false, syncTimer;
function scheduleSync(ms=2500){ if (!S.cfg) return; clearTimeout(syncTimer); syncTimer = setTimeout(sync, ms); }
async function sync(){
  if (!S.cfg) { setStatus("local"); return; }
  if (!navigator.onLine) { setStatus("pending", "Offline. Wird synchronisiert, sobald du wieder online bist."); return; }
  if (syncing) { again = true; return; }
  syncing = true; setStatus("sync");
  try {
    const remote = await fetchTree();
    await syncSettings(remote);
    await bulkPush(remote);
    await pushImages(remote);
    await pushNotes(remote);
    await pullNotes(remote);
    S.lastSync = Date.now(); persist();
    const pending = [...S.notes.values()].some(n => n._dirty) || S.pendingImg.length;
    setStatus(pending ? "pending" : "ok");
  } catch (e) { console.error(e); setStatus("err", e.message || "Synchronisation fehlgeschlagen."); }
  finally { syncing = false; render(); if (again) { again = false; scheduleSync(300); } }
}
// Viele Änderungen auf einmal (z. B. Import): in wenigen Commits über die Git-Daten-API statt einzeln
async function gitBlobSha(bytes){
  const head = new TextEncoder().encode(`blob ${bytes.length}\0`), all = new Uint8Array(head.length + bytes.length);
  all.set(head); all.set(bytes, head.length);
  return [...new Uint8Array(await crypto.subtle.digest("SHA-1", all))].map(b => b.toString(16).padStart(2,"0")).join("");
}
async function bulkPush(remote){
  const notes = [...S.notes.values()].filter(n => n._dirty && !n._deleted && !isEmpty(n) && (!remote.has(`notes/${n.id}.md`) || remote.get(`notes/${n.id}.md`) === n._sha));
  const imgs = S.pendingImg.filter(p => !remote.has(p));
  if (notes.length + imgs.length < 20) return;
  const br = encodeURIComponent(S.cfg.branch);
  let r = await gh(`/git/ref/heads/${br}`); if (!r.ok) return; // leeres Repo: normaler Weg
  let parent = (await r.json()).object.sha;
  r = await gh(`/git/commits/${parent}`); if (!r.ok) throw new Error(await ghErr(r));
  let baseTree = (await r.json()).tree.sha;
  const entries = [], after = [];
  for (const p of imgs) {
    const blob = await idb.get("img:" + p); if (!blob) continue;
    const bytes = new Uint8Array(await blob.arrayBuffer());
    const rb = await gh(`/git/blobs`, {method:"POST", body:JSON.stringify({content:bytesToB64(bytes), encoding:"base64"})});
    if (!rb.ok) throw new Error(await ghErr(rb));
    const sha = (await rb.json()).sha;
    entries.push({path:p, mode:"100644", type:"blob", sha}); after.push(() => { remote.set(p, sha); S.pendingImg = S.pendingImg.filter(x => x !== p); });
  }
  for (const n of notes) {
    const text = toMarkdown(n), sha = await gitBlobSha(new TextEncoder().encode(text)), rev = n._rev, path = `notes/${n.id}.md`;
    entries.push({path, mode:"100644", type:"blob", content:text});
    after.push(() => { n._sha = sha; remote.set(path, sha); if (n._rev === rev) n._dirty = false; });
  }
  for (let i = 0; i < entries.length; i += 400) {
    const chunk = entries.slice(i, i + 400), done = after.slice(i, i + 400);
    setStatus("sync", `Lade hoch: ${Math.min(i + 400, entries.length)} von ${entries.length}`);
    let rt = await gh(`/git/trees`, {method:"POST", body:JSON.stringify({base_tree:baseTree, tree:chunk})}); if (!rt.ok) throw new Error(await ghErr(rt));
    const tree = (await rt.json()).sha;
    let rc = await gh(`/git/commits`, {method:"POST", body:JSON.stringify({message:`Import: ${chunk.length} Dateien`, tree, parents:[parent]})}); if (!rc.ok) throw new Error(await ghErr(rc));
    const commit = (await rc.json()).sha;
    let ru = await gh(`/git/refs/heads/${br}`, {method:"PATCH", body:JSON.stringify({sha:commit})}); if (!ru.ok) throw new Error(await ghErr(ru));
    parent = commit; baseTree = tree; done.forEach(f => f()); persist();
  }
}
async function pushImages(remote){
  for (const p of [...S.pendingImg]) {
    if (remote.has(p)) { S.pendingImg = S.pendingImg.filter(x => x !== p); continue; }
    const blob = await idb.get("img:" + p);
    if (!blob) { S.pendingImg = S.pendingImg.filter(x => x !== p); continue; }
    const b64 = bytesToB64(new Uint8Array(await blob.arrayBuffer()));
    const r = await putFile(p, b64, null, `Bild ${p}`);
    if (!r.ok) throw new Error(await ghErr(r));
    const j = await r.json(); remote.set(p, j.content.sha);
    S.pendingImg = S.pendingImg.filter(x => x !== p); persist();
  }
  for (const p of [...S.deleteImg]) {
    const sha = remote.get(p);
    if (sha) { const r = await deleteFile(p, sha, `Bild entfernt ${p}`); if (!r.ok && r.status !== 404) throw new Error(await ghErr(r)); remote.delete(p); }
    S.deleteImg = S.deleteImg.filter(x => x !== p); S.pendingImg = S.pendingImg.filter(x => x !== p);
    idb.del("img:" + p); persist();
  }
}
async function pushNotes(remote){
  for (const n of [...S.notes.values()]) {
    if (!n._dirty) continue;
    const path = `notes/${n.id}.md`, rsha = remote.get(path);
    if (n._deleted) {
      if (rsha) { const r = await deleteFile(path, rsha, `Gelöscht: ${n.title || n.id}`); if (!r.ok && r.status !== 404) throw new Error(await ghErr(r)); remote.delete(path); }
      S.notes.delete(n.id); persist(); continue;
    }
    if (isEmpty(n)) continue;
    // Auf einem anderen Gerät geändert, seit wir zuletzt abgeglichen haben?
    if (rsha && rsha !== n._sha) {
      const other = fromMarkdown(await fetchBlobText(rsha), n.id); other._sha = rsha; other._dirty = false;
      if (other.updated > n.updated) { // die andere Version ist neuer: sie gewinnt, unsere wird Kopie
        const copy = {...n, id:uid(), title:(n.title || "Ohne Titel") + " (Konflikt)", _sha:null, _dirty:true, _rev:1};
        S.notes.set(copy.id, copy); S.notes.set(other.id, other); persist(); continue;
      }
    }
    const rev = n._rev;
    const r = await putFile(path, textToB64(toMarkdown(n)), rsha, `${n._sha ? "Geändert" : "Neu"}: ${n.title || "Ohne Titel"}`);
    if (!r.ok) throw new Error(await ghErr(r));
    const j = await r.json();
    n._sha = j.content.sha; remote.set(path, n._sha);
    if (n._rev === rev) n._dirty = false;
    persist();
  }
}
async function pullNotes(remote){
  const seen = new Set(), todo = [];
  for (const [path, sha] of remote) {
    if (!path.startsWith("notes/") || !path.endsWith(".md")) continue;
    const id = path.slice(6, -3); seen.add(id);
    const local = S.notes.get(id);
    if (local && (local._sha === sha || local._dirty)) continue;
    todo.push([id, sha]);
  }
  // Mehrere Notizen gleichzeitig laden (schneller beim ersten Mal auf einem neuen Gerät)
  let next = 0, done = 0;
  const worker = async () => {
    while (next < todo.length) {
      const [id, sha] = todo[next++];
      const n = fromMarkdown(await fetchBlobText(sha), id);
      n.id = id; n._sha = sha; n._dirty = false; n._rev = 0;
      if (S.open && S.open.id === id) { if (!S.open._edited) { Object.assign(S.open, n); renderEditor(true); } }
      else S.notes.set(id, n);
      done++;
      if (done % 100 === 0) { persist(); setStatus("sync", `Lade Notizen: ${done} von ${todo.length}`); if (!S.open) render(); }
    }
  };
  await Promise.all(Array.from({length: Math.min(8, todo.length)}, worker));
  for (const n of [...S.notes.values()]) if (n._sha && !n._dirty && !seen.has(n.id)) S.notes.delete(n.id);
  persist();
}
async function syncSettings(remote){
  const path = "merkn-config.json", rsha = remote.get(path), st = S.settings;
  let rc = null;
  if (rsha && rsha !== st._sha) { try { rc = JSON.parse(await fetchBlobText(rsha)); } catch {} }
  if (st._dirty) {
    if (rc) { // auf einem anderen Gerät geändert: Favoriten von beiden Seiten zusammenführen
      const base = st._baseFav || [], mine = st.favTags || [], theirs = Array.isArray(rc.favTags) ? rc.favTags : [];
      const added = mine.filter(t => !base.includes(t)), removed = base.filter(t => !mine.includes(t));
      st.favTags = [...new Set([...theirs, ...added])].filter(t => !removed.includes(t));
    }
    const r = await putFile(path, textToB64(JSON.stringify({keywords:st.keywords, fallback:st.fallback, favTags:st.favTags||[], tabTags:st.tabTags||[], swipeR:st.swipeR, swipeL:st.swipeL, ...(st.gClientId ? {gClientId:st.gClientId} : {})}, null, 2)), rsha, "Einstellungen");
    if (!r.ok) throw new Error(await ghErr(r));
    st._sha = (await r.json()).content.sha; st._dirty = false; st._baseFav = [...(st.favTags||[])];
    remote.set(path, st._sha);
  } else if (rc) {
    if (rc.keywords) st.keywords = rc.keywords; if (rc.fallback) st.fallback = rc.fallback;
    if (Array.isArray(rc.favTags)) st.favTags = rc.favTags;
    if (Array.isArray(rc.tabTags)) st.tabTags = rc.tabTags;
    if (rc.swipeR) st.swipeR = rc.swipeR; if (rc.swipeL) st.swipeL = rc.swipeL; if (rc.gClientId) st.gClientId = rc.gClientId;
    st._sha = rsha; st._baseFav = [...(st.favTags||[])];
  }
}

const urlCache = new Map();
async function imageURL(path){
  if (urlCache.has(path)) return urlCache.get(path);
  let blob = await idb.get("img:" + path);
  if (!blob && S.cfg) {
    try { const r = await gh(`/contents/${path.split("/").map(encodeURIComponent).join("/")}?ref=${encodeURIComponent(S.cfg.branch)}`, {headers:{Accept:"application/vnd.github.raw"}});
      if (r.ok) { const raw = await r.blob(); blob = new Blob([raw], {type: mimeFor(path)}); idb.set("img:" + path, blob); } } catch {}
  }
  if (!blob) return null;
  const u = URL.createObjectURL(blob); urlCache.set(path, u); return u;
}
async function fileBlob(path){
  let blob = await idb.get("img:" + path);
  if (!blob && S.cfg && navigator.onLine) {
    try { const r = await gh(`/contents/${path.split("/").map(encodeURIComponent).join("/")}?ref=${encodeURIComponent(S.cfg.branch)}`, {headers:{Accept:"application/vnd.github.raw"}});
      if (r.ok) { blob = new Blob([await r.blob()], {type: mimeFor(path)}); idb.set("img:" + path, blob); } } catch {}
  }
  return blob || null;
}

/* ---------- Backup als ZIP (ohne Komprimierung, ohne Bibliothek) ---------- */
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = b => { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC_T[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
function makeZip(files){ // files: [{name, data:Uint8Array}]
  const enc = new TextEncoder(), parts = [], central = []; let off = 0;
  const d = new Date(), dt = ((d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1)), dd = (((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate());
  for (const f of files) {
    const nm = enc.encode(f.name), crc = crc32(f.data), h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true); h.setUint16(10, dt, true); h.setUint16(12, dd, true);
    h.setUint32(14, crc, true); h.setUint32(18, f.data.length, true); h.setUint32(22, f.data.length, true); h.setUint16(26, nm.length, true); h.setUint16(28, 0, true);
    parts.push(new Uint8Array(h.buffer), nm, f.data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true); c.setUint16(12, dt, true); c.setUint16(14, dd, true);
    c.setUint32(16, crc, true); c.setUint32(20, f.data.length, true); c.setUint32(24, f.data.length, true); c.setUint16(28, nm.length, true); c.setUint32(42, off, true);
    central.push(new Uint8Array(c.buffer), nm);
    off += 30 + nm.length + f.data.length;
  }
  const csize = central.reduce((a, x) => a + x.length, 0), e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, csize, true); e.setUint32(16, off, true);
  return new Blob([...parts, ...central, new Uint8Array(e.buffer)], {type:"application/zip"});
}
async function makeBackup(){
  const enc = new TextEncoder(), notes = [...S.notes.values()].filter(n => !n._deleted), files = [];
  for (const n of notes) files.push({name:`notes/${n.id}.md`, data:enc.encode(toMarkdown(n))});
  files.push({name:"merkn-config.json", data:enc.encode(JSON.stringify({keywords:S.settings.keywords, fallback:S.settings.fallback, favTags:S.settings.favTags||[], tabTags:S.settings.tabTags||[], swipeR:S.settings.swipeR, swipeL:S.settings.swipeL}, null, 2))});
  const media = [...new Set(notes.flatMap(n => [...n.images, ...(n.audio||[])]))]; let missing = 0, i = 0;
  for (const p of media) {
    i++; if (i % 5 === 0) setStatus("sync", `Backup: Dateien ${i} von ${media.length}`);
    const b = await fileBlob(p); if (b) files.push({name:p, data:new Uint8Array(await b.arrayBuffer())}); else missing++;
  }
  files.push({name:"LIESMICH.txt", data:enc.encode(`Merkn-Backup vom ${new Date().toLocaleString("de-DE")}\n${notes.length} Notizen, ${media.length - missing} Bilder und Aufnahmen.\n\nWiederherstellen: ZIP entpacken, in Merkn unter Einstellungen → Allgemein → „Ordner importieren“ den entpackten Ordner wählen.\nJede Notiz ist eine lesbare Textdatei im Ordner notes.\n`)});
  return {zip:makeZip(files), count:notes.length, media:media.length - missing, missing};
}
async function backupNow(){
  toast("Backup wird erstellt …");
  try {
    const {zip, count, media, missing} = await makeBackup();
    setStatus(S.cfg ? (([...S.notes.values()].some(n => n._dirty)) ? "pending" : "ok") : "local");
    const name = `merkn-backup-${localDay(new Date())}.zip`, file = new File([zip], name, {type:"application/zip"});
    try { localStorage.setItem("merkn-backup", localDay(new Date())); } catch {}
    const mb = zip.size / 1048576, size = mb >= 1 ? `${mb.toLocaleString("de-DE", {maximumFractionDigits:1})} MB` : `${Math.max(1, Math.round(zip.size / 1024))} KB`;
    const info = `${count} Notizen${media ? `, ${media} ${media === 1 ? "Datei" : "Dateien"}` : ""}, ${size}${missing ? ` (${missing} Bilder nicht erreichbar)` : ""}`;
    if (navigator.canShare && navigator.canShare({files:[file]})) {
      try { await navigator.share({files:[file], title:name}); toast(`Backup geteilt: ${info}.`); return; } catch (e) { if (e && e.name === "AbortError") return; }
    }
    const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 30000);
    toast(`Backup heruntergeladen: ${info}.`);
  } catch (e) { console.error(e); toast("Backup fehlgeschlagen: " + (e.message || e)); }
}
/* ---------- Backup direkt in Google Drive (nur eigene Dateien, Recht drive.file) ---------- */
const GD = {token:null, exp:0, loading:null};
const gClient = () => (S.settings.gClientId || "").trim();
function loadGIS(){
  if (window.google?.accounts?.oauth2) return Promise.resolve();
  if (GD.loading) return GD.loading;
  return GD.loading = new Promise((res, rej) => { const sc = document.createElement("script"); sc.src = "https://accounts.google.com/gsi/client"; sc.async = true; sc.onload = res; sc.onerror = () => { GD.loading = null; rej(new Error("Google-Anmeldung konnte nicht geladen werden.")); }; document.head.appendChild(sc); });
}
// Muss direkt aus einem Tipp heraus aufgerufen werden, sonst blockt der Browser das Anmeldefenster
function driveToken(){
  return new Promise((res, rej) => {
    if (GD.token && Date.now() < GD.exp - 60000) return res(GD.token);
    if (!window.google?.accounts?.oauth2) return rej(new Error("Google-Anmeldung lädt noch. Bitte gleich noch einmal tippen."));
    const tc = google.accounts.oauth2.initTokenClient({client_id:gClient(), scope:"https://www.googleapis.com/auth/drive.file",
      callback: r => { if (r.error) return rej(new Error(r.error === "access_denied" ? "Zugriff auf Drive wurde nicht erlaubt." : "Google: " + r.error)); GD.token = r.access_token; GD.exp = Date.now() + (r.expires_in || 3600) * 1000; try { localStorage.setItem("merkn-gd-ok", "1"); } catch {} res(GD.token); },
      error_callback: e => rej(new Error(e && e.type === "popup_closed" ? "Anmeldung abgebrochen." : "Anmeldefenster wurde blockiert oder geschlossen."))});
    let ok = false; try { ok = localStorage.getItem("merkn-gd-ok") === "1"; } catch {}
    tc.requestAccessToken({prompt: ok ? "" : "consent"});
  });
}
async function gdrive(url, opts = {}){
  const r = await fetch(url, {...opts, headers:{Authorization:`Bearer ${GD.token}`, ...(opts.headers || {})}});
  if (r.status === 401) { GD.token = null; throw new Error("Google-Anmeldung abgelaufen. Bitte noch einmal tippen."); }
  if (!r.ok) { let m = ""; try { m = (await r.json()).error.message; } catch {} throw new Error(`Drive-Fehler ${r.status}${m ? ": " + m : ""}`); }
  return r;
}
async function driveFolder(){
  let id = ""; try { id = localStorage.getItem("merkn-gd-folder") || ""; } catch {}
  if (id) { try { const r = await gdrive(`https://www.googleapis.com/drive/v3/files/${id}?fields=id,trashed`); const j = await r.json(); if (!j.trashed) return id; } catch {} }
  const q = encodeURIComponent("mimeType='application/vnd.google-apps.folder' and name='Merkn Backups' and trashed=false");
  const j = await (await gdrive(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)&spaces=drive`)).json();
  id = j.files?.[0]?.id;
  if (!id) id = (await (await gdrive("https://www.googleapis.com/drive/v3/files?fields=id", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({name:"Merkn Backups", mimeType:"application/vnd.google-apps.folder"})})).json()).id;
  try { localStorage.setItem("merkn-gd-folder", id); } catch {}
  return id;
}
async function backupToDrive(){
  if (!gClient()) { openSettings("backup"); return toast("Erst die Google-Client-ID eintragen, siehe Anleitung."); }
  if (!navigator.onLine) return toast("Für Drive brauchst du Internet.");
  let tokenP;
  try { tokenP = driveToken(); } catch (e) { return toast(e.message); }
  try {
    await tokenP;
    toast("Backup wird erstellt …");
    const {zip, count, media, missing} = await makeBackup();
    setStatus(S.cfg ? ([...S.notes.values()].some(n => n._dirty) ? "pending" : "ok") : "local");
    const folder = await driveFolder(), name = `merkn-backup-${localDay(new Date())}.zip`;
    toast("Lade in Drive hoch …");
    const init = await gdrive("https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&fields=id", {method:"POST", headers:{"Content-Type":"application/json; charset=UTF-8", "X-Upload-Content-Type":"application/zip", "X-Upload-Content-Length":String(zip.size)}, body:JSON.stringify({name, parents:[folder], mimeType:"application/zip"})});
    const loc = init.headers.get("Location"); if (!loc) throw new Error("Drive hat keine Upload-Adresse geliefert.");
    await gdrive(loc, {method:"PUT", headers:{"Content-Type":"application/zip"}, body:zip});
    try { localStorage.setItem("merkn-backup", localDay(new Date())); } catch {}
    const mb = zip.size / 1048576, size = mb >= 1 ? `${mb.toLocaleString("de-DE", {maximumFractionDigits:1})} MB` : `${Math.max(1, Math.round(zip.size / 1024))} KB`;
    toast(`In Drive gesichert (Ordner „Merkn Backups“): ${count} Notizen${media ? `, ${media} ${media === 1 ? "Datei" : "Dateien"}` : ""}, ${size}${missing ? `, ${missing} Bilder nicht erreichbar` : ""}.`);
  } catch (e) { console.error(e); toast(e.message || "Backup in Drive fehlgeschlagen."); }
}
const backupAny = () => gClient() ? backupToDrive() : backupNow();
function backupReminder(){
  if (!S.notes.size || S.welcome) return;
  let last = "", shown = ""; try { last = localStorage.getItem("merkn-backup") || ""; shown = localStorage.getItem("merkn-backup-erinnert") || ""; } catch {}
  const today = localDay(new Date()); if (shown === today) return;
  const days = last ? Math.floor((Date.parse(today) - Date.parse(last)) / 864e5) : null;
  if (days !== null && days < 30) return;
  if (days === null && S.notes.size < 20) return;

async function checkShareInbox(){

  const hours = Array.from({length:25}, (_,i) => i);
  dialog(`<h2>Zeit</h2><p>Gefiltert wird nach dem Zeitpunkt, an dem eine Notiz entstanden ist.</p>
    <section class="tsec"><label class="f">Jahr</label><div class="tgrid years">${["alle", ...years].map(y => `<button class="tag" data-year="${y}" aria-pressed="${y === "alle" ? !(v.from||v.to) : v.from === y+"-01-01" && v.to === y+"-12-31"}">${y === "alle" ? "Alle" : y}</button>`).join("")}</div></section>

      <div class="trange"><select class="inp" id="tH1" aria-label="Von Uhr"><option value="">–</option>${hours.slice(0,24).map(h => `<option ${v.h1 === h ? "selected" : ""}>${h}</option>`).join("")}</select><span>bis</span><select class="inp" id="tH2" aria-label="Bis Uhr"><option value="">–</option>${hours.slice(1).map(h => `<option ${v.h1 != null && (v.h2 === h % 24) ? "selected" : ""}>${h}</option>`).join("")}</select><span>Uhr</span></div></section>
    <section class="tsec"><label class="f">Sortieren nach</label><div class="tgrid two2"><button class="tag" data-sort="created" aria-pressed="${v.sort === "created"}">Entstanden</button><button class="tag" data-sort="updated" aria-pressed="${v.sort === "updated"}">Zuletzt bearbeitet</button></div></section>

    set("[data-year]", "data-year", y => { d.querySelector("#tFrom").value = y === "alle" ? "" : y+"-01-01"; d.querySelector("#tTo").value = y === "alle" ? "" : y+"-12-31"; });

    d.querySelector("[data-ok]").onclick = () => {

/* ---------- Links: kurz anzeigen, anklickbar ---------- */
const URL_RE = /\bhttps?:\/\/(?:[^\s<>"'()]|\([^\s<>"'()]*\))+(?<![.,;:!?])/g;
function shortUrl(u){
  try {
    const x = new URL(u), host = x.hostname.replace(/^www\./, "");
    let seg = decodeURIComponent(x.pathname).split("/").filter(t => t && !/^(dp|gp|aw|d|p|products|product|shop|en|de|eu|status|watch|video|b|r|s|share|wiki)$/i.test(t) && !/^[A-Z0-9]{8,}$/.test(t) && !/^\d+$/.test(t))[0] || "";
    seg = seg.replace(/\.(html?|php)$/i, "").replace(/[-_+]+/g, " ").replace(/\s+/g, " ").trim();
    if (seg.length > 22) seg = seg.slice(0, 21).trim() + "…";
    return seg ? `${host} › ${seg}` : host;
  } catch { return u.length > 40 ? u.slice(0, 39) + "…" : u; }
}
const shortLinks = t => String(t || "").replace(URL_RE, u => "🔗 " + shortUrl(u));
function linkify(t){
  let out = "", last = 0;
  for (const m of String(t || "").matchAll(URL_RE)) {
    out += esc(t.slice(last, m.index)) + `<a class="lnk" href="${esc(m[0])}" target="_blank" rel="noopener" title="${esc(m[0])}">${esc(shortUrl(m[0]))}</a>`;
    last = m.index + m[0].length;
  }
  return out + esc(t.slice(last));
}

const MD_RE = /(\*\*[^*\n]+\*\*|^#{1,3} |^\s*[-*•] |\[\[[^\]\n]+\]\]|~~[^~\n]+~~|\+\+[^+\n]+\+\+|(^|[^*\w])\*[^*\s][^*\n]*\*(?!\*))/m;

const fmtInline = h => h.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*\w])\*(?=\S)([^*\n]*?\S)\*(?!\*)/g, "$1<em>$2</em>").replace(/~~([^~\n]+)~~/g, "<s>$1</s>").replace(/\+\+([^+\n]+)\+\+/g, "<u>$1</u>");

const findByTitle = t => { const k = norm(t.trim()); return [...S.notes.values()].find(o => !o._deleted && !o.trashed && norm((o.title || "").trim()) === k); };
function inlineMd(t){ return fmtInline(linkify(t)).replace(/\[\[([^\]\n]+)\]\]/g, (m, x) => `<a href="#" class="nlink${findByTitle(x.replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&#39;/g,"'")) ? "" : " missing"}" data-note="${x}">${x}</a>`); }

  return String(text || "").split("\n").map(l => {
    const h = l.match(/^(#{1,3})\s+(.*)$/);
    if (h) return `<span class="mdh mdh${h[1].length}">${inlineMd(h[2])}</span>`;
    const b = l.match(/^(\s*)[-*•]\s+(.*)$/);
    if (b) return `<span class="mdli" style="padding-left:${Math.min(3, Math.floor(b[1].length / 2)) * 16 + 16}px">${inlineMd(b[2])}</span>`;
    return inlineMd(l);

const plainMd = t => stripFmt(String(t || "").replace(/\[\[([^\]\n]+)\]\]/g, "$1").replace(/^#{1,3}\s+/gm, "").replace(/^\s*[-*]\s+/gm, "• "));

const plainKeep = t => String(t || "").replace(/\[\[([^\]\n]+)\]\]/g, "$1").replace(/^#{1,3}\s+/gm, "").replace(/^\s*[-*]\s+/gm, "• ");

const slugify = t => norm(t).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 48);

      while (stack.length > 1 && stack[stack.length-1].depth >= depth) stack.pop();

      const depth = root ? 0 : parent.depth + 1, ind = "  ".repeat(depth);

// Eintrag im Baum umbenennen, Link ändern, abhakbar machen oder löschen

/* ---------- Lesemodus: große Schrift, schmale Spalte, keine Knöpfe ---------- */
function readerSize(d){ let z = 21; try { z = +localStorage.getItem("merkn-read-size") || 21; } catch {} if (d) { z = Math.min(32, Math.max(16, z + d)); try { localStorage.setItem("merkn-read-size", z); } catch {} } return z; }
function openReader(n){
  closeReader();

  const items = n.items.length ? `<ul class="rditems">${n.items.map(i => `<li class="${i.d ? "done" : ""}">${esc(i.t)}</li>`).join("")}</ul>` : "";

    <article class="rdtext" style="font-size:${readerSize()}px">${n.title.trim() ? `<h1>${esc(n.title)}</h1>` : ""}<div class="rdbody">${body}</div>${items}</article>`;

let dict = null;

function startDictation(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition; if (!SR) return;
  const n = S.open;
  let target = document.activeElement;
  if (!target || !(target.classList.contains("itxt") || target.id === "edBody" || target.id === "edTitle")) target = $("#edBody");
  const kind = target.id === "edTitle" ? "title" : target.classList.contains("itxt") ? {i:+target.dataset.idx} : "body";
  const get = () => kind === "title" ? n.title : kind === "body" ? n.body : n.items[kind.i]?.t ?? "";
  const set = v => { if (kind === "title") n.title = v; else if (kind === "body") n.body = v; else if (n.items[kind.i]) n.items[kind.i].t = v; };
  let base = get();

    if (fin) { base = base + sep + fin.trim(); set(base); edChanged(); }
    const shown = interim ? base + (base && !/\s$/.test(base) ? " " : "") + interim : base;
    const field = kind === "title" ? $("#edTitle") : kind === "body" ? $("#edBody") : document.querySelector(`.itxt[data-idx="${kind.i}"]`);
    if (field) { field.value = shown; if (field.tagName === "TEXTAREA") autosize(field); }

  rec.onend = () => { if (dict === rec) { dict = null; if (S.open) renderEditor(true); } };
  try { rec.start(); dict = rec; renderEditor(true); target.focus(); } catch { toast("Diktat konnte nicht starten."); }
}

/* ---------- Gedichte erkennen (feste Regeln, keine KI) ---------- */
const VOW = "aeiouyäöü";
function rhymeKey(line){
  const w = (line.toLowerCase().match(/[a-zäöüß]+/g) || []).pop(); if (!w || w.length < 2) return null;
  let x = w.replace(/ß/g, "ss").replace(/ck/g, "k").replace(/ie/g, "i").replace(/([aeiouäöü])h/g, "$1").replace(/(.)\1/g, "$1")
    .replace(/ä/g, "e").replace(/eu|äu/g, "oi").replace(/ei|ai/g, "ai").replace(/d$/, "t").replace(/g$/, "k").replace(/b$/, "p");
  // Vokalgruppen von hinten: bei unbetonter Endung (Hände/Ende, Sonne/Wonne) die vorletzte mit nehmen
  const groups = [...x.matchAll(/[aeiouyöü]+/g)]; if (!groups.length) return null;
  let g = groups[groups.length - 1];
  if (groups.length > 1 && /^e[lnrmst]?$|^en[st]?$|^er[nst]?$/.test(x.slice(g.index))) g = groups[groups.length - 2];
  return {key: x.slice(g.index), word: w};
}
function poemScore(n){
  if (n.kind === "tree" || n.items.length) return null;
  const lines = n.body.split("\n").map(l => l.trim()).filter(Boolean);
  if (lines.length < 4) return null;
  if (lines.filter(l => /^([-*•]|\d+[.)]|#{1,3} )/.test(l) || /https?:\/\//.test(l)).length > lines.length * .25) return null;
  const avg = lines.reduce((a, l) => a + l.length, 0) / lines.length;
  if (avg > 70) return null;
  const keys = lines.map(rhymeKey), hit = new Set(), pairs = [];
  for (let i = 0; i < keys.length; i++) for (let j = i + 1; j <= Math.min(i + 3, keys.length - 1); j++) {
    const a = keys[i], b = keys[j];
    if (a && b && a.key === b.key && a.word !== b.word && a.key.length >= 2) { if (!hit.has(i) || !hit.has(j)) pairs.push([a.word, b.word]); hit.add(i); hit.add(j); }
  }

function importDialog(){
  dialog(`<h2>Von Claude übernehmen</h2><p>Füge hier ein, was Claude dir gegeben hat. Mehrere Notizen trennst du mit einer Zeile ---.</p>
    <textarea class="inp" id="imp" style="min-height:220px" placeholder="# Titel&#10;Bereich: Freelance&#10;Tags: #idee&#10;&#10;- [ ] Erster Punkt"></textarea>

    d.querySelector("[data-x]").onclick = closeDialog;
    d.querySelector("[data-ok]").onclick = () => {
      const raw = cleanPaste(d.querySelector("#imp").value); if (!raw) return;
      let parts = raw.replace(/^Hier (ist|sind)[^\n]*\n+/i, "").split(/\n\s*---\s*\n(?=\s*(#|---|\S))/).filter(p => p && p.trim() && !/^(#|---|\S)$/.test(p.trim()));
      if (/^---\n/.test(raw)) parts = [raw];
      const parsed = parts.map(p => fromMarkdown(p, uid())).filter(n => !isEmpty(n));
      const sameAs = n => n.title.trim() && [...S.notes.values()].find(o => !o._deleted && norm(o.title.trim()) === norm(n.title.trim()));
      const dups = parsed.filter(sameAs);
      const finish = mode => {
        let made = 0, replaced = 0;
        for (const n of parsed) {
          const old = sameAs(n);
          if (old && mode === "replace") { old.body = n.body; old.items = n.items; if (n.kind) old.kind = n.kind; old.tags = [...new Set([...old.tags, ...n.tags])]; if (!n.areaAuto) { old.area = n.area; old.areaAuto = false; } touch(old, {reclassify:false}); replaced++; continue; }

        }

      const names = dups.map(n => `„${esc(n.title)}“`).join(", ");

      });
    };
  });
}

function cleanPaste(t){ return String(t || "").replace(/\r\n/g, "\n").split("\n").filter(l => !/^\s*```/.test(l)).join("\n").trim(); }

/* ---------- Ordner-Import (z. B. aus Google Keep umgewandelt) ---------- */
$("#dfile").onchange = async e => {
  const files = [...e.target.files]; e.target.value = "";
  const rel = f => (f.webkitRelativePath || f.name).split("/");
  const mdFiles = files.filter(f => /\.md$/i.test(f.name) && rel(f).includes("notes"));
  if (!mdFiles.length) return toast("Kein Ordner „notes“ mit Notizen gefunden.");
  let notes = 0, media = 0;
  toast(`Importiere ${mdFiles.length} Notizen …`);
  for (const f of files) {
    const parts = rel(f), i = parts.findIndex(x => x === "images" || x === "audio");
    if (i < 0 || i === parts.length - 1) continue;
    const path = parts.slice(i).join("/");
    if (!(await idb.get("img:" + path))) { await idb.set("img:" + path, new Blob([f], {type: mimeFor(path)})); if (!S.pendingImg.includes(path)) S.pendingImg.push(path); media++; }
  }
  for (const f of mdFiles) {
    const id = f.name.replace(/\.md$/i, "");
    if (S.notes.has(id)) continue;
    const n = fromMarkdown(await f.text(), id);
    n.id = id; n._sha = null; n._dirty = true; n._rev = 1;
    S.notes.set(id, n); notes++;
  }
  persist(); render();
  toast(`${notes} Notizen und ${media} Dateien importiert.` + (S.cfg ? " Hochladen läuft, das kann einige Minuten dauern." : ""));
  scheduleSync(500);
};

async function testConnection(cfg){

  if (!r.ok) throw new Error(await ghErr(r));

  if (!j.private) return "warn";
  if (j.permissions && !j.permissions.push) throw new Error("Der Schlüssel hat keine Schreibrechte auf dieses Repo.");
  return "ok";
